name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: imperator
          POSTGRES_USER: imperator
          POSTGRES_PASSWORD: imperator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imperator -d imperator"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Content cross-references resolve
        run: python3 tools/validate_content.py

      - name: Content JSON is current
        run: python3 tools/build_content.py --check

      - name: Rulebook tables are current
        run: python3 tools/render_tables.py --check

      - name: Layout reference statistics are current
        run: python3 tools/layout_reference.py --check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build app/Imperator.slnx -c Release

      - name: Tests
        run: dotnet test app/Imperator.slnx -c Release --no-build

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: EF migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project app/src/Imperator.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: EF migrations apply to PostgreSQL
        run: dotnet ef database update --project app/src/Imperator.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build
