# Temporary: runs the simulator for decision 3.20 (hit target 7+) and commits the reports to this branch.
# Removed before the branch is merged.
name: Sim hit 7+
on:
  push:
    branches: [hit-target-7]
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compare 8+ and 7+ (Task Force Boone at Shoot 2)
        run: dotnet run -c Release --project app/src/Imperator.Sim -- --compare "Hit 8+=docs/analysis/variants/hit-8.json" "Hit 7+=content/dist/content.json" --n 20000 > docs/analysis/hit-7-compare.txt
      - name: Simulator report at 7+
        run: dotnet run -c Release --project app/src/Imperator.Sim -- docs/analysis/sim-v0.5-results.md
      - name: Troop value duel scores at 7+
        run: dotnet run -c Release --project app/src/Imperator.Sim -- --values docs/analysis/troop-values-v0.5.md
      - name: Commit the reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/analysis
          git commit -m "Simulator reports at hit target 7+" || exit 0
          git push origin HEAD:hit-target-7
