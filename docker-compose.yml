# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: imperator
      POSTGRES_USER: imperator
      POSTGRES_PASSWORD: imperator   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imperator -d imperator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
