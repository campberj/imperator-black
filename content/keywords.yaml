# Keywords for Imperator Black, rules v0.3.
version: 0.3.0

weapon:
  - { id: handy,          name: Handy,          text: "Ignores the moved-this-activation penalty." }
  - { id: auto,           name: Auto,           text: "May use Suppressive Fire." }
  - { id: suppressing,    name: Suppressing,    text: "A hit also adds 1 Suppression." }
  - { id: one_per_round,  name: One per round,  text: "May fire once per round, including reactions." }
  - { id: cumbersome,     name: Cumbersome,     text: "An extra -1 when firing after a Move; cannot fire as a reaction." }
  - { id: blast,          name: Blast,          text: "Affects every model within the blast radius with line of sight to the point of impact." }
  - { id: confined_bonus, name: Confined,       text: "+1 wound row to models in an enclosed compartment of 6\" x 6\" or smaller." }
  - { id: breach,         name: Breach,         text: "Can destroy doors, hatches and thin bulkheads." }

armour:
  - { id: sealed, name: Sealed, text: "Protected from vacuum and smoke; resists decompression tests (+2)." }
  - { id: heavy,  name: Heavy,  text: "Move 5\"." }

model:
  - { id: void_trained, name: Void-trained, text: "Ignores the unbraced zero-g penalty; may push off and stop at any surface." }
  - { id: low_light,    name: Low-light,    text: "Ignores the darkness penalty." }
  - { id: tech,         name: Tech,         text: "May Hack locked doors and consoles (Interact test 9+)." }
  - { id: medic,       name: Medic,        text: "+2 to Medic actions; automatically recovers a row-6 Down model." }
  - { id: leader,       name: Leader,       text: "A Rally made by a Leader, or on a model within 6\" and in line of sight of a Leader, removes 2 Suppression instead of 1. The side's highest-Q Leader adds its Q to initiative." }
