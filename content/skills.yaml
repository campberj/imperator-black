# Model skills for Imperator Black, rules v0.5.
# Skills can have levels. levels[0] is level 1; a higher level includes everything below it.
# Written on profiles as "Name" (one level) or "Name 2".
# status: settled (approved) or proposed (new rule awaiting approval).
version: 0.5.0

skills:
  - id: leader
    name: Leader
    status: settled
    levels:
      - "A Rally made by a Leader, or on a model within 6\" and in line of sight of a Leader, removes 2 Suppression instead of 1. At initiative, each side adds the Nerve of its Leader with the highest Nerve."

  - id: void_trained
    name: Void-trained
    status: settled
    levels:
      - "Ignores the unbraced zero-g penalty; may push off and stop at any surface."

  - id: low_light
    name: Low-light
    status: settled
    levels:
      - "Ignores the darkness penalty."

  - id: medic
    name: Medic
    status: settled
    levels:
      - "+2 to Medic actions; automatically gets a Down model back up."

  - id: automated
    name: Automated
    status: settled
    levels:
      - "Never gains Suppression, never tests for breaking, and is not affected by casualty shock or Rally. A wound row of 6 or more destroys it. Attributes shown as a dash are never used."

  - id: marksman
    name: Marksman
    status: proposed
    levels:
      - "Aim gives +2 instead of +1."
      - "An Aimed shot also ignores the Light cover penalty."

  # Galactic Republic (Jedi abilities are trained skills: no Force powers).
  - id: deflect
    name: Deflect
    status: proposed
    levels:
      - "Holding a lightsaber and not Pinned: when hit by a ranged attack it can see, test 2d6 + Fight, 8+, to deflect it (no effect). −1 for each earlier deflection this round. Test each hit of a burst separately."
      - "A deflection on 12 or more sends the bolt back: the shooter takes the hit, rolling the weapon's damage dice on the wound table."
  - id: leap
    name: Leap
    status: proposed
    levels:
      - "A Move may include one leap, up or down one level (3\") or across a gap up to 3\", at no extra cost. Drops up to 6\" need no falling test."
  - id: jedi_discipline
    name: Jedi discipline
    status: proposed
    levels:
      - "Never takes breaking tests and ignores casualty shock. Pinned only at 4 or more Suppression."
  - id: twin_blades
    name: Twin blades
    status: proposed
    levels:
      - "Fights with two blades: +1 to close combat exchange rolls."
  - id: scout
    name: Scout
    status: proposed
    levels:
      - "Deploys up to 6\" beyond its side's deployment zone, out of enemy line of sight. Scrub and woods are not difficult ground for it."

  # BLKOUT forces (UN, Manticor, Harlow).
  - id: shield
    name: Shield
    status: proposed
    levels:
      - "Carries a ballistic shield or shield emitter: when it has no other cover, it counts as in Light cover against shots from the half of the table it faces."
  - id: layered_armour
    name: Layered armour
    status: proposed
    levels:
      - "Explosions step one extra row down against it."
  # Near Present forces.
  - id: laser_detector
    name: Laser detector
    status: proposed
    levels:
      - "Laser warning receivers cue its fire: its Reaction and Overwatch shots do not take the −1 for reacting."

  - id: augmented
    name: Augmented
    status: proposed
    levels:
      - "Genetically or cybernetically augmented: +1 to Physique tests, and it ignores the first Suppression it gains each round."
  - id: self_destruct
    name: Self-destruct
    status: proposed
    levels:
      - "As an action: an Explosion (2) centred on itself, 2d10 damage, AP 2 (chapter 6). Then remove the model. Very loud."
      - "A bigger warhead: Explosion (3). Set off in base contact with a door, hatch or thin bulkhead, it also destroys it, as a breaching charge."

