# Core resolution values for Imperator Black.
# Single source of truth: the rulebook tables and the app both read this file.
version: 0.5.0

dice:
  hit: 2d6
  test: 2d6

hit_target: 8          # 2d6 + Shoot + modifiers must reach this
test_target: 8         # default target for tests unless a rule says otherwise
natural_miss: 2        # a natural 2 always misses / fails
critical_hit: [6, 6]   # natural double 6: +1 wound row

# Rank is a label for experience and standing. It does not enter any roll;
# the attributes do. typical: the usual value of a troop's main attributes at that rank.
ranks:
  - { id: green,   name: Green,   typical: "0-1", text: "New to the job: crew, conscripts, fresh hires." }
  - { id: regular, name: Regular, typical: "1",   text: "Trained and steady: most soldiers and professional security." }
  - { id: veteran, name: Veteran, typical: "2",   text: "Experienced: team leaders, specialists, seasoned contractors." }
  - { id: elite,   name: Elite,   typical: "3",   text: "The best there is: special operators, intelligence handlers." }

# Model attributes. Tests and attacks roll 2d6 + the attribute named in the rule.
# What Shoot values mean (RJ, 2026-10-21). A unit's class sets its baseline Shoot; a specialist
# (marksman, gunner) may sit one above it in its speciality. Rank is experience within the class.
shoot_scale:
  - { value: "0",  text: "Irregulars, conscripts, armed civilians." }
  - { value: "1",  text: "Trained military and professional security." }
  - { value: "2",  text: "Professionals: rangers, Task Force Boone, top-tier contractors." }
  - { value: "3",  text: "Elite units: Raid Force Alpha, Delta Force." }
  - { value: "4 or more", text: "Legendary heroes." }

attributes:
  - { id: move,     name: Move,     short: MOV, text: "Inches per Move action (usually 5-7). Training, exoskeletons and heavy kit all show here." }
  - { id: shoot,    name: Shoot,    short: SHT, text: "Hit rolls, Suppressive Fire and reaction shots." }
  - { id: fight,    name: Fight,    short: FGT, text: "Close combat exchanges." }
  - { id: physique, name: Physique, short: PHY, text: "Throwing, forcing doors with a breaching tool, holding on in decompression, getting up when Down." }
  - { id: nerve,    name: Nerve,    short: NRV, text: "Breaking tests, Find Cover, and initiative for Leaders." }
  - { id: tech,     name: Tech,     short: TEC, text: "Medic actions, hacking, putting out fires and other technical work." }
  - { id: wounds,   name: Wounds,   short: W,   text: "Wounded markers a model can carry; one more puts it Down." }
  - { id: size,     name: Size,     short: SZ,  text: "Physical bulk: 1 small drone, 2 human, 3 large (walkers and vehicles are larger). Used by rules for hatches, cover and vehicles." }

# Hacking: each lock or system has a security level, set by the mission (default: secured).
# A hack is Interact, 2d6 + Tech against the target number; some levels need several successes,
# which accumulate across actions and models. Each failed attempt on the same target gives +1 to
# later attempts on it (cumulative, up to working_bonus_max).
security:
  working_bonus_per_failure: 1
  working_bonus_max: 3
  levels:
    - { id: basic,    name: Basic,    target: 7,  successes: 1, examples: "Storage, cargo hatches, crew quarters" }
    - { id: secured,  name: Secured,  target: 9,  successes: 1, examples: "Most locked doors, ship's systems" }
    - { id: hardened, name: Hardened, target: 9,  successes: 2, examples: "Command decks, armouries, data cores" }
    - { id: military, name: Military, target: 10, successes: 2, examples: "Warship systems, patron-grade encryption" }

# Automatic fire (Auto N): extra targets must be within zone inches of the first target.
auto_fire:
  zone: 3
  extra_target_modifier: -1

suppression:
  modifier_per_marker: -1
  max: 5
  pinned_at: 3
  cancels_overwatch_at: 2

hit_modifiers:
  - { id: aim,              value: 1,  text: "Aim" }
  - { id: light_cover,      value: -1, text: "Target in Light cover" }
  - { id: heavy_cover,      value: -2, text: "Target in Heavy cover" }
  - { id: suppression,      value: -1, text: "Each Suppression on shooter", per_marker: true }
  - { id: wounded,          value: -1, text: "Shooter has any Wounded markers" }
  - { id: moved,            value: -1, text: "Moved earlier this activation (not Handy)" }
  - { id: reaction,         value: -1, text: "Reaction or Overwatch shot" }
  - { id: unbraced_zero_g,  value: -1, text: "Unbraced in zero-g (not Void-trained)" }
  - { id: darkness,         value: -2, text: "Target in darkness beyond 6\" (no low-light gear)" }

# Rows are looked up by damage total, then stepped down by (Armour - AP), minimum 0.
# Rows above 10 count as 10. Row 0 or lower: no effect.
wound_table:
  - { row: 1,  min: 2,  max: 3,  id: shaken,   text: "Shaken: +1 Suppression" }
  - { row: 2,  min: 4,  max: 4,  id: rattled,  text: "Rattled: +2 Suppression" }
  - { row: 3,  min: 5,  max: 5,  id: grazed,   text: "Grazed: +1 Suppression" }
  - { row: 4,  min: 6,  max: 7,  id: wounded,  text: "Wounded: add a Wounded marker. More markers than Wounds: Down" }
  - { row: 5,  min: 8,  max: 9,  id: wounded_s, text: "Wounded and +1 Suppression. More markers than Wounds: Down" }
  - { row: 6,  min: 10, max: 11, id: down,     text: "Down: may recover (end-of-round test 8+, or Medic)" }
  - { row: 7,  min: 12, max: 13, id: bleeding, text: "Down and bleeding: dies at end of third round unless Medic 8+" }
  - { row: 8,  min: 14, max: 15, id: critical, text: "Critical: dies at end of next round unless Medic 10+" }
  - { row: 9,  min: 16, max: 18, id: dead,     text: "Dead" }
  - { row: 10, min: 19, max: 99, id: dead_x,   text: "Dead; friends within 1\" gain 1 Suppression" }

movement:
  obstacle_cost: 2
  reaction_move: half

# Overwatch (decision 4.5, RJ 2026-10-22): one reaction before the model next activates.
overwatch_reactions: 1

casualty_shock:
  range: 6
  suppression: 1
  suppression_leader: 2

down_recovery:
  test_target: 8
  on_pass: [wounded, suppression_3]
