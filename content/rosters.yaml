# Player force organisation for Imperator Black, rules v0.5.
# Tables of organisation (TOE): the player builds a force from teams, not a points list.
# slots: role slots filled by a troop type; gear_choice lets the player pick gear per model.
version: 0.5.0

teams:
  - id: vat_fireteam
    name: Void Assault Team (VAT) fireteam
    faction: tfb
    summary: "The boarding fireteam: assault, a close-quarters gunner, and a data specialist."
    slots:
      - { troop: tfb_vat_leader,      count: 1 }
      - { troop: tfb_vat_assaulter,   count: 2, gear_choice: 1 }
      - { troop: tfb_vat_gunner,      count: 1 }
      - { troop: tfb_data_specialist, count: 1 }

  - id: pathfinder_team
    name: Pathfinder recon team
    faction: tfb
    summary: "Recon and fire support with armour-piercing heavy rifles and a SAW."
    slots:
      - { troop: tfb_pathfinder_leader, count: 1 }
      - { troop: tfb_pathfinder,        count: 2, gear_choice: 1 }
      - { troop: tfb_pathfinder_gunner, count: 1 }

  - id: control_team
    name: Control team
    faction: tfb
    summary: "Two marksmen who hold overwatch over long passages, hangars and open decks."
    slots:
      - { troop: tfb_marksman, count: 2 }

# The force the player starts the proof-of-concept campaign with.
  # ---------------- Galactic Republic ----------------
  - id: clone_squad
    name: Clone trooper squad
    faction: republic
    summary: "A sergeant, three riflemen and a Z-6 or RPS-6 heavy trooper."
    slots:
      - { troop: rep_clone_sergeant, count: 1 }
      - { troop: rep_clone_trooper,  count: 3 }
      - { troop: rep_clone_heavy,    count: 1 }

  - id: clone_marksman_team
    name: Clone marksman team
    faction: republic
    summary: "Two marksmen with DC-15x rifles for overwatch and long shots."
    slots:
      - { troop: rep_clone_marksman, count: 2 }

  - id: arc_team
    name: ARC trooper team
    faction: republic
    summary: "Elite assault troopers with twin pistols and specialist weapons."
    slots:
      - { troop: rep_arc_leader,  count: 1 }
      - { troop: rep_arc_trooper, count: 3 }

  - id: arf_team
    name: ARF trooper team
    faction: republic
    summary: "Scouts who deploy forward and spot for the squads behind them."
    slots:
      - { troop: rep_arf_trooper, count: 3 }

  - id: commando_squad
    name: Clone commando squad
    faction: republic
    summary: "Four commandos in Katarn armour: breaching, slicing, sniping and demolitions."
    slots:
      - { troop: rep_commando_leader, count: 1 }
      - { troop: rep_clone_commando,  count: 3 }

starting_forces:
  - id: poc_boarding_element
    name: Boarding element
    faction: tfb
    summary: "One VAT fireteam plus one attached specialist: 6 models."
    teams: [vat_fireteam]
    attachments:
      choose: 1
      from: [tfb_pathfinder, tfb_marksman]
    recommended_gear:
      - "One VAT Assaulter carries a breaching charge, the other a trauma kit."
      - "Attach a Pathfinder with a trauma kit if you expect long fights; a Marksman for ships with hangars or long passages."
