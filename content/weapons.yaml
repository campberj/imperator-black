# Weapons for Imperator Black, rules v0.5.
# damage: dice pair thrown with the hit dice (ranged) or by the winner (melee).
# short_range: inches; beyond it range_penalty[0], beyond double range_penalty[1].
# auto: rate of fire for Auto weapons (the N in Auto N): how many different models one Shoot or Suppressive Fire may engage.
# damage: a matched pair (2d4 to 2d12) or a half-step mixed pair (d6+d8, d8+d10, d10+d12).
# explosion: the X in Explosion (X), the radius in inches (thrown weapons give it as blast_radius).
# rounds: a launcher's other rounds; choose one before each Shoot. The weapon line itself is its first round.
version: 0.5.0

ranged:
  - { id: sidearm,     name: Sidearm,     damage: 2d6,  short_range: 8,  ap: 0, keywords: [handy] }
  - { id: smg,         name: SMG,         damage: 2d8,  short_range: 12, ap: 0, auto: 2, keywords: [handy, auto] }
  - { id: carbine,     name: Carbine,     damage: 2d8,  short_range: 18, ap: 0, keywords: [handy] }
  - { id: shotgun,     name: Shotgun,     damage: 2d12, short_range: 10, ap: 0, keywords: [handy], range_penalty: [-2, -3] }
  - { id: rifle,       name: Rifle,       damage: 2d8,  short_range: 30, ap: 0, keywords: [] }
  - { id: heavy_rifle, name: Heavy rifle, damage: 2d8,  short_range: 30, ap: 1, keywords: [] }
  - { id: lmg,         name: LMG,         damage: 2d8,  short_range: 30, ap: 0, auto: 3, keywords: [auto, suppressing] }
  - { id: compact_lmg, name: Compact LMG, damage: 2d8,  short_range: 18, ap: 0, auto: 3, keywords: [handy, auto, suppressing] }
  - { id: dmr,         name: DMR,         damage: 2d10, short_range: 48, ap: 0, keywords: [] }
  - { id: at_launcher, name: AT launcher, damage: 2d12, short_range: 36, ap: 1, keywords: [one_per_round, cumbersome],
      round: Anti-armour, rounds: [{ id: he, name: High explosive, damage: d8+d10, ap: 0, explosion: 2 }] }
  - { id: auto_rifle,  name: Auto rifle,  damage: 2d8,  short_range: 24, ap: 0, auto: 2, keywords: [auto] }
  - { id: hmg,         name: HMG,         damage: 2d10, short_range: 30, ap: 1, auto: 3, keywords: [auto, suppressing, cumbersome] }
  - { id: amr,         name: Anti-materiel rifle, damage: 2d12, short_range: 48, ap: 2, keywords: [cumbersome] }

  # Galactic Republic (faction: republic). Listed with the Republic forces in chapter 9.
  - { id: dc17,        faction: republic, name: DC-17 hand blaster,        damage: 2d6,  short_range: 8,  ap: 0, keywords: [handy] }
  - { id: dc17_pair,   faction: republic, name: Twin DC-17s,               damage: 2d6,  short_range: 8,  ap: 0, auto: 2, keywords: [handy, auto] }
  - { id: dc15s,       faction: republic, name: DC-15S blaster carbine,    damage: 2d8,  short_range: 18, ap: 0, keywords: [handy] }
  - { id: dc15a,       faction: republic, name: DC-15A blaster rifle,      damage: 2d8,  short_range: 30, ap: 0, keywords: [] }
  - { id: dc15x,       faction: republic, name: DC-15x sniper rifle,       damage: 2d10, short_range: 48, ap: 0, keywords: [] }
  - { id: dc17m,       faction: republic, name: DC-17m (blaster),          damage: 2d8,  short_range: 24, ap: 0, keywords: [handy] }
  - { id: dc17m_sniper, faction: republic, name: DC-17m (sniper),          damage: 2d10, short_range: 40, ap: 0, keywords: [] }
  - { id: dc17m_at,    faction: republic, name: DC-17m (anti-armour),      damage: 2d12, short_range: 24, ap: 1, keywords: [one_per_round] }
  - { id: dp23,        faction: republic, name: DP-23 phase-pulse blaster, damage: 2d12, short_range: 10, ap: 0, keywords: [handy], range_penalty: [-2, -3] }
  - { id: z6,          faction: republic, name: Z-6 rotary blaster,        damage: 2d8,  short_range: 18, ap: 0, auto: 3, keywords: [auto, suppressing] }
  - { id: rps6,        faction: republic, name: RPS-6 rocket launcher,     damage: 2d12, short_range: 36, ap: 1, keywords: [one_per_round, cumbersome],
      round: Anti-armour, rounds: [{ id: he, name: High explosive, damage: d8+d10, ap: 0, explosion: 2 }] }

  # Near Present (faction: anchorage / hankou). Robot (CCT) weapon modules; listed with those forces in chapter 9.
  - { id: m134,      faction: anchorage, name: M134 minigun,            damage: 2d8,  short_range: 24, ap: 0, auto: 4, keywords: [auto, suppressing] }
  - { id: ac20,      faction: anchorage, name: 20mm autocannon,         damage: 2d12, short_range: 36, ap: 2, auto: 2, keywords: [auto, breach] }
  - { id: maaws,     faction: anchorage, name: MAAWS recoilless rifle,  damage: 2d12, short_range: 30, ap: 2, keywords: [one_per_round, breach],
      round: Anti-armour, rounds: [{ id: ap, name: Anti-personnel, damage: d8+d10, ap: 0, explosion: 3 }] }
  - { id: cs_lm5,    faction: hankou,    name: CS/LM5 rotary gun,       damage: 2d8,  short_range: 24, ap: 0, auto: 3, keywords: [auto, suppressing] }
  - { id: dzj08,     faction: hankou,    name: Dual DZJ-08 recoilless,  damage: 2d12, short_range: 30, ap: 2, keywords: [one_per_round, breach],
      round: Anti-armour, rounds: [{ id: he, name: High explosive, damage: d8+d10, ap: 0, explosion: 2 }] }

melee:
  - { id: unarmed,       name: "Unarmed / weapon butt",      damage: 2d4, ap: 0 }
  - { id: knife,         name: "Knife or bayonet",           damage: 2d8, ap: 0 }
  - { id: breaching_tool, name: "Breaching tool or heavy blade", damage: 2d10, ap: 0 }
  - { id: combat_blade,  name: "Boarding axe or combat blade", damage: 2d10, ap: 1 }
  - { id: lightsaber,    faction: republic, name: Lightsaber, damage: 2d12, ap: 2 }

# Thrown weapons use the Throw action. throw_range: short range in inches.
thrown:
  - id: frag
    name: Frag grenade
    throw_range: 8
    blast_radius: 2
    damage: 2d8
    ap: 0
    keywords: [explosion, confined_bonus]
  - id: flashbang
    name: Flashbang
    throw_range: 8
    blast_radius: 3
    effect: "+2 Suppression; removes Overwatch; cannot react until end of round"
    keywords: [explosion]
  - id: smoke
    name: Smoke grenade
    throw_range: 8
    blast_radius: 2
    effect: "Blocks line of sight through the area until end of next round"
    keywords: []
  - id: thermal_detonator
    faction: republic
    name: Thermal detonator
    throw_range: 8
    blast_radius: 2
    damage: 2d10
    ap: 0
    keywords: [explosion, confined_bonus]

demolitions:
  - id: breaching_charge
    name: Breaching charge
    effect: "Destroys a door, hatch or thin bulkhead; models within 2\" on the far side gain 2 Suppression; models within 1\" take 2d6 damage"
    damage: 2d6
    ap: 0
    keywords: [breach]
