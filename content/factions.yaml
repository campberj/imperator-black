# Factions and enemy elements for Imperator Black, rules v0.5.
# Elements are the building blocks the mission generator draws enemy forces from.
version: 0.5.0

factions:
  - id: tfb
    name: Task Force Boone
    side: player
    summary: "Expeditionary task force whose Void Assault Teams board and clear ships and stations."
  - id: republic
    name: Galactic Republic
    side: player
    summary: "The Grand Army of the Republic: clone troopers, specialists and commandos led by clone officers and Jedi."
  - id: freespace
    name: Freespace Solutions
    side: enemy
    summary: "Privatized debt and salvage corporation that unofficially conducts grey-zone operations for paying patrons."
  - id: contractor
    name: Contractors
    side: enemy
    summary: "Mercenary companies and hired guns Freespace pays by the job."
  - id: un
    name: UN Force Command
    side: enemy
    summary: "The Authority's regular forces: the professional 3rd Battalion and the augmented Raid Force Alpha, with their inorganic combat units."
  - id: directorate
    name: Meridian Directorate
    side: enemy
    summary: "Technocratic state run through its intelligence ministries; Freespace's current patron."

# composition: troop id and count. alternatives: other troop ids the generator may swap in.
elements:
  - id: salvage_crew
    name: Salvage crew
    faction: freespace
    tier: 1
    behavior: cowed
    composition: [{ troop: fs_salvage_hand, count: 3 }]

  - id: asset_security
    name: Asset security
    faction: freespace
    tier: 1
    behavior: sentry
    composition: [{ troop: fs_security, count: 2 }, { troop: fs_security_gunner, count: 1 }]

  - id: recovery_captain
    name: Recovery captain
    faction: freespace
    tier: 1
    behavior: leader
    composition: [{ troop: fs_recovery_captain, count: 1 }]

  - id: collections_enforcers
    name: Collections enforcers
    faction: freespace
    tier: 2
    behavior: aggressive
    composition: [{ troop: fs_enforcer, count: 3 }]

  - id: salvage_techs
    name: Salvage techs
    faction: freespace
    tier: 2
    behavior: saboteur
    composition: [{ troop: fs_tech, count: 2 }]

  - id: automated_defences
    name: Automated defences
    faction: freespace
    tier: 2
    behavior: automated
    composition: [{ troop: fs_turret, count: 1 }]
    alternatives: [fs_drone]

  - id: repossession_team
    name: Repossession team
    faction: freespace
    tier: 3
    behavior: aggressive
    composition: [{ troop: fs_repo_breacher, count: 3 }]

  - id: liquidators
    name: Liquidators
    faction: freespace
    tier: 3
    behavior: tactical
    composition: [{ troop: fs_liquidator, count: 2 }]

  - id: hired_gun
    name: Hired gun
    faction: contractor
    tier: 3
    behavior: attached
    composition: [{ troop: ct_hired_marksman, count: 1 }]
    alternatives: [ct_hired_heavy]

  - id: contract_boarding_team
    name: Contract boarding team
    faction: contractor
    tier: 3
    behavior: tactical
    reaction_force: true
    composition: [{ troop: ct_borz_boarder, count: 3 }, { troop: ct_borz_heavy, count: 1 }]

  - id: contract_reaction_force
    name: Contract reaction force
    faction: contractor
    tier: 3
    behavior: aggressive
    reaction_force: true
    composition: [{ troop: ct_harlow_operator, count: 3 }, { troop: ct_harlow_gunner, count: 1 }]

  - id: borz_bratva
    name: Borz Bratva team
    faction: contractor
    tier: 3
    behavior: sentry
    composition: [{ troop: ct_borz_bratva, count: 2 }, { troop: ct_borz_bratva_hmg, count: 1 }]

  - id: borz_cyka
    name: Borz Cyka team
    faction: contractor
    tier: 3
    behavior: aggressive
    composition: [{ troop: ct_borz_cyka, count: 1 }, { troop: ct_borz_cyka_bravo, count: 1 }]

  - id: borz_ubiytsa
    name: Ubiytsa shock team
    faction: contractor
    tier: 3
    behavior: aggressive
    composition: [{ troop: ct_borz_ubiytsa_leader, count: 1 }, { troop: ct_borz_ubiytsa, count: 3 }]

  - id: harlow_control
    name: Harlow control team
    faction: contractor
    tier: 3
    behavior: tactical
    reaction_force: true
    composition: [{ troop: ct_harlow_leader, count: 1 }, { troop: ct_harlow_grenadier, count: 1 }]

  - id: harlow_engineers
    name: Harlow engineers
    faction: contractor
    tier: 3
    behavior: tactical
    composition: [{ troop: ct_harlow_engineer, count: 2 }]

  - id: harlow_crickets
    name: Cricket drones
    faction: contractor
    tier: 3
    behavior: automated
    composition: [{ troop: ct_harlow_cricket, count: 2 }]

  - id: harlow_veterans
    name: Harlow veterans
    faction: contractor
    tier: 3
    behavior: aggressive
    composition: [{ troop: ct_harlow_veteran, count: 3 }]

  - id: harlow_springbok
    name: Springbok AI
    faction: contractor
    tier: 3
    behavior: automated
    composition: [{ troop: ct_harlow_springbok, count: 1 }]

  - id: un3_fireteam
    name: UN reserve fireteam
    faction: un
    tier: 4
    behavior: tactical
    composition: [{ troop: un3_rifleman, count: 3 }, { troop: un3_at_specialist, count: 1 }]
    alternatives: [un3_data_specialist]

  - id: un3_pointmen
    name: UN Pointmen
    faction: un
    tier: 4
    behavior: aggressive
    composition: [{ troop: un3_pointman, count: 2 }, { troop: un3_pointman_gunner, count: 1 }]

  - id: un3_batcon
    name: UN Battalion Controller
    faction: un
    tier: 4
    behavior: leader
    composition: [{ troop: un3_batcon, count: 1 }]

  - id: rfa_fireteam
    name: Raid Force Alpha fireteam
    faction: un
    tier: 4
    behavior: tactical
    composition: [{ troop: rfa_assaulter, count: 2 }]
    alternatives: [rfa_grenadier]

  - id: rfa_specialists
    name: Raid Force Alpha specialists
    faction: un
    tier: 4
    behavior: tactical
    composition: [{ troop: rfa_marksman, count: 1 }, { troop: rfa_grenadier, count: 1 }]

  - id: rfa_golem
    name: Golem unit
    faction: un
    tier: 4
    behavior: attached
    composition: [{ troop: rfa_golem, count: 1 }]

  - id: rfa_mother
    name: UTG Mother
    faction: un
    tier: 4
    behavior: leader
    composition: [{ troop: rfa_mother, count: 1 }]

  - id: directorate_handler
    name: Directorate handler
    faction: directorate
    tier: 4
    behavior: handler
    composition: [{ troop: md_handler, count: 1 }]

  - id: directorate_operators
    name: Directorate deniable operators
    faction: directorate
    tier: 4
    behavior: tactical
    composition: [{ troop: md_operator, count: 3 }]

threat_tiers:
  - { tier: 1, name: Low,    summary: "Crew and asset security under a recovery captain." }
  - { tier: 2, name: Medium, summary: "Adds collections enforcers, salvage techs and automated defences." }
  - { tier: 3, name: High,   summary: "Adds repossession teams, liquidators and hired guns; a contractor reaction force answers high alert." }
  - { tier: 4, name: Story,  summary: "Adds Meridian Directorate handlers or deniable operators, or UN Force Command: the 3rd Battalion and Raid Force Alpha." }
