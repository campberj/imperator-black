# Gear for Imperator Black, rules v0.5.
# grants_skills: skills (and levels) the gear gives its carrier.
# status: settled (approved; rules cover it) or proposed (new rule awaiting approval).
version: 0.5.0

gear:
  - id: breaching_charge
    name: Breaching charge
    text: "One charge. Place with Interact on a door, hatch or thin bulkhead within 1\"; detonate later as an action (chapter 6)."
    grants_skills: {}
    status: settled

  - id: breaching_tool
    name: Breaching tool
    text: "Force a locked door: Interact, 2d6 + Physique, 8+ (chapter 3). Also counts as a breaching tool or heavy blade in close combat."
    grants_skills: {}
    melee: breaching_tool
    status: settled

  - id: trauma_kit
    name: Trauma kit
    text: "The carrier has the Medic skill."
    grants_skills: { medic: 1 }
    status: settled

  - id: hacking_rig
    name: Hacking rig
    text: "The carrier may Hack locked doors and consoles: Interact, 2d6 + Tech against the security level (chapter 3). Quiet."
    grants_skills: {}
    status: settled

  - id: low_light_optics
    name: Low-light optics
    text: "The carrier has the Low-light skill: it ignores the darkness penalty."
    grants_skills: { low_light: 1 }
    status: settled

  - id: extinguisher
    name: Extinguisher
    text: "May Interact with a fire cell in contact: 2d6 + Tech, 8+ to put it out (chapter 8)."
    grants_skills: {}
    status: settled

  - id: silencer
    name: Silencer
    text: "The carrier's ranged weapon gains the Silenced keyword: its shots are not noise for the alert track."
    grants_skills: {}
    weapon_keywords: [silenced]
    status: settled

  - id: jump_pack
    name: Jump pack
    text: "Move ignores the extra cost of obstacles and may cross gaps up to half the model's Move. In zero-g, the model may change direction freely during a Move and stop anywhere, even away from a surface (it still counts as unbraced)."
    grants_skills: {}
    status: settled

  - id: grenade_launcher
    name: Grenade launcher
    text: "The carrier may Throw frag grenades using Shoot instead of Physique, with a throw range of 18\". Its Throws are fired (chapter 6: a natural 2 is a dud), Very loud, and count as Shoot actions for reactions."
    grants_skills: {}
    status: proposed

  - id: ballistic_shield
    name: Ballistic shield
    text: "The carrier has the Shield skill. It cannot use a weapon with the Cumbersome keyword while carrying it."
    grants_skills: { shield: 1 }
    status: proposed

  - id: jammer
    name: Jammer
    text: "Enemy Automated models within 6\" take -2 to hit, and enemy Hack tests within 6\" take -2."
    grants_skills: {}
    status: settled

  # Near Present robot (CCT) modules.
  - id: mk19
    name: Mk19 grenade launcher
    text: "Mounted automatic grenade launcher. The carrier may Throw frag grenades using Shoot instead of Physique, with a throw range of 30\"; one Shoot action throws two, at points within 3\" of each other. Its Throws are fired (chapter 6: a natural 2 is a dud), Very loud, and count as Shoot actions for reactions."
    grants_skills: {}
    status: proposed

  - id: owa_package
    name: Mobility and one-way attack package
    text: "Climbing legs and a warhead: the carrier crosses obstacles at no extra cost and has Self-destruct 2 (Explosion 3)."
    grants_skills: { self_destruct: 2 }
    status: proposed

  - id: flux_warhead
    name: Flux warhead
    text: "Once per mission, as an action: an electromagnetic burst. Every Automated model within 6\", friend or foe and including the carrier, takes a hit of 2d10 damage, AP 3."
    grants_skills: {}
    status: proposed

  - id: coop_engagement
    name: Cooperative engagement package
    text: "Shares targeting data: once per round, a friendly model within 12\" of the carrier gets +1 on one Shoot test against an enemy the carrier can see."
    grants_skills: {}
    status: proposed
