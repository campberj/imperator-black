# Missions, rules v0.5 (chapter 13). Aboard ship (chapter 11 decks) and on land (chapter 12 tables).
# A mission is built from: a type, a threat tier, the board, the objective, the enemy (an open guard
# and hidden contacts), a complication, and the alert track. status: proposed until playtested.
version: 0.5.0

# --------------------------------------------------------------- mission types
mission_roll:
  - { roll: "1-2", mission: seize }
  - { roll: "3", mission: recover }
  - { roll: "4", mission: sabotage }
  - { roll: "5-6", mission: capture }

missions:
  - id: seize
    name: Seize data or cargo
    summary: "Reach the objective, take what it holds, and get it out."
    objectives: 1
    ship: "The heart (chapter 11)."
    land: "The middle sector of the far row (chapter 12)."
    task: "A model in base contact may Interact to take it: automatic for a model with a hacking rig (data) or Physique 2 or more (cargo); 2d6 + Tech (data) or Physique (cargo), 8+, for anyone else. Data travels with the model that copied it; cargo is carried, and the carrier has −2\" Move. If the carrier goes Down, a model in base contact may take it with an Interact."
    lockdown: "The enemy locks it down: taking the objective now needs two successful Interacts, and a Hack of Secured (9+) first if it is data."
    decisive: "Objective extracted and no player model Dead."
    marginal: "Objective extracted."
    failure: "Objective not extracted when time runs out."

  - id: recover
    name: Recover personnel
    summary: "Find a captured friend or a hostage, free them, and bring them out alive."
    objectives: 1
    ship: "The compartment farthest from the airlock by route, other than the heart; the heart if there is no other."
    land: "A sector of the far row: roll a die, 1–2 left, 3–4 middle, 5–6 right."
    task: "The hostage (unit card: Hostage) starts bound in the objective. A player model in base contact frees them with an Interact. From then on the hostage is a player model: it activates after the model that freed it, every round, and must end each activation within 3\" of a player model if it can."
    lockdown: "The enemy moves the hostage: at the end of the round, the nearest enemy model within 6\" of a bound hostage moves it up to 6\" toward the enemy's exit, with it."
    decisive: "Hostage extracted alive and no player model Dead."
    marginal: "Hostage extracted alive."
    failure: "Hostage Dead, still held, or not extracted when time runs out."

  - id: sabotage
    name: Sabotage
    summary: "Destroy two targets and get out."
    objectives: 2
    ship: "The heart, and the compartment farthest from it by route."
    land: "Two sectors of the far row: the left and right ones."
    task: "A model in base contact sets a charge with an Interact (models without breaching charges use the target's own systems: same Interact). The target is destroyed at the end of that round (Very loud), unless an enemy model is in base contact with it then, which disarms the charge."
    lockdown: "The enemy guards the targets: place one new contact within 3\" of each target still standing."
    decisive: "Both targets destroyed and the force extracted with no player model Dead."
    marginal: "One target destroyed and the force extracted."
    failure: "No target destroyed, or the force breaks."

  - id: capture
    name: Capture a high-value target
    summary: "Take a named enemy alive and bring them out."
    objectives: 1
    ship: "The heart."
    land: "The middle sector of the far row."
    task: "The high-value target (HVT) is the tier's HVT model, placed at the objective with the guard. Take it by overpowering it in close combat, capturing it while Down (chapter 7), or when it surrenders: the HVT tests to surrender (chapter 10) whenever it is Pinned or Wounded with a player model within 6\" and no friend within 6\". A prisoner moves with a player model in base contact, which halves that model's Move."
    lockdown: "The HVT runs: from now on it activates first each enemy turn, using the Handler profile's escape line toward the enemy's exit. If it leaves the board, it has escaped."
    decisive: "HVT extracted as a prisoner and no player model Dead."
    marginal: "HVT extracted as a prisoner, or Dead (with the body or its data recovered: an Interact in base contact)."
    failure: "HVT escaped or still at large when time runs out."

# --------------------------------------------------------------- enemy forces by threat tier
tier_roll:
  - { roll: "1-3", tier: 1 }
  - { roll: "4-5", tier: 2 }
  - { roll: "6", tier: 3 }

# contacts: hidden contact chips placed at the start. table: d6 contact table (also used for the guard).
# entries are element ids, or false_alarm / booby_trap. reinforcement: the element that answers alert 4.
# hvt: the troop used as the high-value target for a capture mission.
tiers:
  - tier: 1
    contacts: 3
    reinforcement: asset_security
    hvt: fs_recovery_captain
    table:
      - { roll: "1", result: false_alarm }
      - { roll: "2", result: salvage_crew }
      - { roll: "3", result: salvage_crew }
      - { roll: "4", result: asset_security }
      - { roll: "5", result: asset_security }
      - { roll: "6", result: recovery_captain }
  - tier: 2
    contacts: 4
    reinforcement: collections_enforcers
    hvt: fs_recovery_captain
    table:
      - { roll: "1", result: false_alarm }
      - { roll: "2", result: salvage_crew }
      - { roll: "3", result: asset_security }
      - { roll: "4", result: collections_enforcers }
      - { roll: "5", result: salvage_techs }
      - { roll: "6", result: automated_defences }
  - tier: 3
    contacts: 4
    reinforcement: contract_reaction_force
    hvt: ct_borz_ubiytsa_leader
    table:
      - { roll: "1", result: booby_trap }
      - { roll: "2", result: collections_enforcers }
      - { roll: "3", result: repossession_team }
      - { roll: "4", result: liquidators }
      - { roll: "5", result: borz_bratva }
      - { roll: "6", result: harlow_veterans }
  - tier: 4
    contacts: 5
    reinforcement: rfa_fireteam
    hvt: md_handler
    table:
      - { roll: "1", result: booby_trap }
      - { roll: "2", result: liquidators }
      - { roll: "3", result: directorate_operators }
      - { roll: "4", result: un3_fireteam }
      - { roll: "5", result: un3_pointmen }
      - { roll: "6", result: rfa_fireteam }

# Other oppositions: the same four threat tiers drawn from another enemy faction. A mission that names an
# opposition uses its tiers; one that names none uses the tiers above (the Outer Reach: Freespace, its
# contractors and patrons, and the UN). Each tier: as above.
oppositions:
  - id: separatist
    name: Separatist Alliance
    summary: "The droid army: battle droid sections, droidekas and tactical droids; at higher tiers B2s, commando droids, MagnaGuards and dwarf spider droids."
    tiers:
      - tier: 1
        contacts: 3
        reinforcement: sep_b1_section
        hvt: sep_tactical
        table:
          - { roll: "1", result: false_alarm }
          - { roll: "2", result: sep_b1_section }
          - { roll: "3", result: sep_b1_section }
          - { roll: "4", result: sep_b1_section }
          - { roll: "5", result: sep_droidekas }
          - { roll: "6", result: sep_tactical_command }
      - tier: 2
        contacts: 4
        reinforcement: sep_b2_squad
        hvt: sep_tactical
        table:
          - { roll: "1", result: false_alarm }
          - { roll: "2", result: sep_b1_section }
          - { roll: "3", result: sep_b1_section }
          - { roll: "4", result: sep_b2_squad }
          - { roll: "5", result: sep_droidekas }
          - { roll: "6", result: sep_tactical_command }
      - tier: 3
        contacts: 4
        reinforcement: sep_bx_squad
        hvt: sep_kraken
        table:
          - { roll: "1", result: booby_trap }
          - { roll: "2", result: sep_b1_section }
          - { roll: "3", result: sep_b2_squad }
          - { roll: "4", result: sep_droidekas }
          - { roll: "5", result: sep_bx_squad }
          - { roll: "6", result: sep_dsd1 }
      - tier: 4
        contacts: 5
        reinforcement: sep_bx_squad
        hvt: sep_grievous
        table:
          - { roll: "1", result: booby_trap }
          - { roll: "2", result: sep_b2_squad }
          - { roll: "3", result: sep_droidekas }
          - { roll: "4", result: sep_bx_squad }
          - { roll: "5", result: sep_magnaguards }
          - { roll: "6", result: sep_dsd1 }

contact_results:
  - { id: false_alarm, name: False alarm, text: "Nothing there: crew who fled, a ventilation fan, a stray animal. Remove the chip." }
  - { id: booby_trap, name: Booby trap, text: "A tripwire charge: resolve a frag grenade centred on the chip (2d8, radius 2\"). It is Very loud. Remove the chip." }

# --------------------------------------------------------------- alert track
alert:
  max: 6
  raises:
    - { source: "Loud noise (chapter 10)", amount: 1 }
    - { source: "Very loud noise", amount: 2 }
    - { source: "An element raises the alarm", amount: 1 }
    - { source: "Each check-in the clock reaches or passes (a check-in is missed)", amount: 1 }
  thresholds:
    - { at: 2, effect: "Contacts move: at the end of each round, every contact moves 6\" toward the marker (or toward the player entry if there is no marker), by the shortest route. Unrevealed elements become Alerted when revealed." }
    - { at: 4, effect: "Reinforcements: at the end of the round, the tier's reinforcement element arrives at the enemy's entry, Alerted." }
    - { at: 6, effect: "Lockdown: the mission type's lockdown happens at the end of the round." }

# --------------------------------------------------------------- complications (d6)
complications:
  - { roll: "1-2", id: none, name: None, text: "No complication." }
  - { roll: "3", id: early_warning, name: Early warning, text: "The alert track starts at 1." }
  - { roll: "4", id: extra_contact, name: Reinforced, text: "One more contact than the tier lists." }
  - { roll: "5", id: tight_window, name: Tight window, text: "The time limit is 5 minutes shorter." }
  - { roll: "6", id: hazard, name: Hazard, text: "Aboard ship, the vessel's first hazard (chapter 11). On land, Night (chapter 12)." }

# --------------------------------------------------------------- time
# The mission clock (RJ, 2026-10-22): no round limit. The mission sets a time limit and a clock die;
# at the end of each round, roll the die and move the clock on that many minutes.
clock:
  sizes:
    - { id: small, name: Small mission, force: "Up to 8 player models", die: d4, limit: 20 }
    - { id: large, name: Large mission, force: "9 or more player models", die: d6, limit: 30 }
  check_in_every: 5
  first_check_in: 10
  rules:
    - "The mission sets its size, or the size of the player force does. The size gives the clock die and the time limit."
    - "The clock starts at 0. At the end of each round, roll the clock die: that many minutes pass. Then resolve the alert track's effects, including any check-in just passed."
    - "Check-ins fall every 5 minutes from minute 10 (10, 15, 20 and so on). Each check-in the clock reaches or passes raises the alert track by 1."
    - "When the clock reaches the time limit, time has run out: the mission ends."

# --------------------------------------------------------------- placement
placement:
  - "Board: a chapter 11 deck aboard ship, a chapter 12 table on land. The mission names the vessel or environment, or roll."
  - "Player force: deploys in the docking passage aboard ship, or within 6\" of its edge on land. It extracts the same way: a model that leaves by the airlock or its own edge is out of the mission, safely."
  - "Objective: as the mission type says. Mark it with the objective token (or two)."
  - "Guard: roll once on the tier's contact table, rerolling false alarms and booby traps, and place that element openly within 3\" of the objective, Unaware. For a capture mission, add the HVT to the guard."
  - "Contacts: place the tier's number of contact chips. Aboard ship, one in each compartment that is not the objective, farthest from the airlock first, then in junctions and small rooms, farthest first. On land, one in each sector of the far two rows that is not the objective's, farthest first, never within 12\" of the player edge. If there are more contacts than places, go round again, farthest first. Number them."
  - "Enemy entry and exit: aboard ship, the spine tile farthest from the airlock; a secondary airlock or escape pod is a second enemy exit. On land, the middle of the enemy's edge."

contacts:
  - "A contact is revealed when a player model can see it, or ends a Move within 3\" of it. Roll on the tier's contact table."
  - "Place the element with its first model on the chip and the rest within 2\", in cover where they can be; then remove the chip."
  - "A revealed element is Unaware while the alert track is below 2, Alerted from 2 on. Either way, newly placed models cannot react until the current activation ends."
  - "A contact that moves into sight of a player model is revealed at once."

# --------------------------------------------------------------- briefing
briefing:
  - { heading: "Tasking", text: "Mission type, and who gives the order." }
  - { heading: "Situation", text: "Two or three sentences: where, who holds it, why now." }
  - { heading: "Objective", text: "What to do, where it is, and how to take it." }
  - { heading: "Opposition", text: "Faction and threat tier; the guard (known); the number of contacts (unknown)." }
  - { heading: "Ground", text: "Vessel and deck seed, or environment and table; conditions or hazard." }
  - { heading: "Complication", text: "If any." }
  - { heading: "Extraction and time", text: "The way out, the time limit and clock die, and the alert track start." }
  - { heading: "Grades", text: "Decisive, Marginal and Failure." }
