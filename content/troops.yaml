# Troop types for Imperator Black, rules v0.5.
# One profile per kind of soldier. Rosters and enemy elements are built from these.
#
# rank: label only (green, regular, veteran, elite); it never enters a roll.
# stats: move, shoot, fight, physique, nerve, tech, wounds, size (see core.yaml attributes).
#        null = never used (Automated models only).
# armour, weapon, melee: ids from armour.yaml / weapons.yaml. *_options: alternatives.
# grenades: thrown ids carried (two at most). gear: ids from gear.yaml.
# skills: skill id -> level, from skills.yaml.
# miniatures: suggested models from RJ's collection.
version: 0.5.0

