# Troop types for Imperator Black, rules v0.3.
# One profile per kind of soldier. Rosters and enemy elements are built from these.
#
# q: Quality 0-3. armour, weapon, melee: ids from armour.yaml / weapons.yaml.
# weapon_options: alternative ranged weapons the roster may swap in.
# grenades: thrown ids carried (default two grenades per model).
# gear: ids from gear.yaml. keywords: model keywords from keywords.yaml.
# miniatures: suggested models from RJ's collection.
version: 0.3.0

troops:
