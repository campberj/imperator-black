# Campaign, rules v0.5 (chapter 14, Phase 7 draft). A campaign is one or more arcs; an arc is a small
# node map played over up to 8 campaign turns, one mission a turn. RJ's calls (2026-10-22): XP and
# advances; Requisition, Intel and Standing; a node map of about 6 missions; examples with Task Force Boone
# against Freespace. status: proposed until playtested. A soldier's Requisition comes from its Troop Value (chapter 15).
version: 0.5.0

# --------------------------------------------------------------- starting a campaign
start:
  force: poc_boarding_element
  roster_max: 12
  requisition: 6
  intel: 1
  standing: 3
  evidence: 0
  text:
    - "Force: the starting force for the faction (for Task Force Boone, the boarding element: one VAT fireteam and one attached specialist). Name every soldier."
    - "Roster: up to 12 soldiers, grouped by fireteam. Up to 8 deploy on a small mission (chapter 13), 12 on a large one."
    - "Force selection: by fireteam (the default) or by soldier. Choose now; it holds for the campaign."
    - "Base: the campaign names its kind, an outpost or a ship (Task Force Boone's arcs: its ship). Every facility starts at level 0; the threat track starts at 0."
    - "Resources: 6 Requisition, 1 Intel, Standing 3, Evidence 0."
    - "Arc: generate the first arc map. The campaign turn marker starts at 1."

# --------------------------------------------------------------- the campaign turn
# Force selection (decision 6.18): chosen when a campaign or short arc starts; written on the campaign sheet.
force_selection:
  - { id: fireteam, name: By fireteam, default: true,
      deploy: "Fireteams (standard, or built to their type: chapter 9), each fielding at least half its slots and its Leader, plus characters, each joining a fireteam or acting alone. Within the mission's TV and model limits.",
      replace: "A replacement fills an empty slot in its own fireteam. New fireteams join whole." }
  - { id: soldier, name: By soldier, default: false,
      deploy: "Any soldiers fit for duty, within the mission's TV and model limits. Before deployment, group them into fireteams of up to 6 for breaking and Rally; characters join one or act alone.",
      replace: "A replacement may be any troop the force fields." }

turn:
  - { step: Tasking, text: "Choose a node to strike: any revealed node linked to the base or to a taken node. If the base is under attack, the mission is its defence instead (see The base). At Standing 2 or less, command chooses for you: the available node with the highest threat tier (ties: your pick)." }
  - { step: Preparation, text: "Collect income: Requisition equal to the Standing table. Spend Requisition (replacements, recovery, facilities) and Intel (node reveals and mission edges). Pick the support assets Standing allows. Choose the soldiers who deploy from those fit for duty." }
  - { step: Mission, text: "Build the node's mission with chapter 13, using its mission type, vessel or environment and threat tier. Play it." }
  - { step: After-action, text: "In order: casualties and injuries, prisoners, the grade's rewards and the node's outcome, XP and the citation, then advances." }
  - { step: Upkeep, text: "Each recovering soldier ticks down one turn. Facility levels bought this turn are finished. Pay the base's upkeep. If the threat track is at its attack level, the base is attacked. Move the turn marker on; if the arc has run out of turns, it ends." }
  - { step: Events, text: "Roll 2d6 on the events table." }

# --------------------------------------------------------------- resources
resources:
  - { id: requisition, name: Requisition, max: null, text: "Buys replacements, faster recovery and base facilities. Unspent Requisition carries over." }
  - { id: threat, name: Threat, max: 6, text: "How close the enemy is to finding and hitting the base. It rises with loud and failed missions and falls with quiet ones; at 4 or more the base is attacked (see The base)." }
  - { id: intel, name: Intel, max: 6, text: "Spent to reveal nodes and to shape a mission before it starts. Gained from data, prisoners and some nodes." }
  - { id: standing, name: Standing, max: 6, text: "Command's confidence in the force. Sets income, support and latitude. At 0 the force is recalled and the campaign ends." }
  - { id: evidence, name: Evidence, max: 6, text: "The case that Freespace answers to the Meridian Directorate (decision 9.7). It is never spent." }

# Standing 0-6: income each turn, support assets per mission, and who chooses the tasking.
standing:
  - { level: 0, name: Recalled,       income: 0, support: 0, text: "The force is pulled out. The campaign ends." }
  - { level: 1, name: Under review,   income: 1, support: 0, text: "Command chooses each tasking." }
  - { level: 2, name: Doubted,        income: 2, support: 0, text: "Command chooses each tasking." }
  - { level: 3, name: Trusted,        income: 3, support: 0, text: "The force chooses its taskings." }
  - { level: 4, name: Valued,         income: 3, support: 1, text: "The force chooses its taskings." }
  - { level: 5, name: Favoured,       income: 4, support: 1, text: "The force chooses its taskings." }
  - { level: 6, name: Command's own,  income: 4, support: 2, text: "The force chooses its taskings." }

# Support assets: picked in Preparation, as many as Standing allows; each once per mission.
support:
  - { id: insertion_window, name: Insertion window, text: "The mission clock's time limit is 5 minutes longer." }
  - { id: signals_cover,    name: Signals cover,    text: "The first check-in does not raise the alert track." }
  - { id: attached_trooper, name: Attached trooper, text: "One extra Regular soldier from the force's teams deploys on loan. Injuries apply to it, but it gains no XP and returns to command after the mission." }
  - { id: intel_package,    name: Intel package,    text: "1 Intel to spend on this mission only." }

# Intel: each use once per mission (node reveals any time in Preparation).
intel_uses:
  - { cost: 1, name: Reveal a node,          text: "A hidden node shows its type." }
  - { cost: 1, name: Their pattern,          text: "The first check-in comes at minute 15, not 10." }
  - { cost: 1, name: Eyes on a contact,      text: "At setup, roll one contact chip's result and place that element openly, Unaware." }
  - { cost: 1, name: Re-roll the complication, text: "Roll the mission's complication again; the second roll stands." }
  - { cost: 2, name: Misdirection,           text: "The threat track falls by 1 (once a turn)." }

# --------------------------------------------------------------- the arc map
arc:
  turns: 8
  columns:
    - { column: 1, nodes: 3, tier: 1, revealed: true }
    - { column: 2, nodes: 2, tier: 2, revealed: false }
    - { column: 3, nodes: 1, tier: 3, revealed: false, target: true }
  procedure:
    - "Draw the base on the left, then three node boxes in a column, two in the next and the target on the right. Number them 1 to 6, top to bottom, left to right; the target is node 6."
    - "Link the base to nodes 1, 2 and 3. Link nodes 4 and 5 to the target."
    - "For each of nodes 1, 2 and 3 roll a die: 1–3 link it to node 4, 4–5 to node 5, 6 to both. If node 4 or 5 has no link from the left, link it to the nearest node in column 1."
    - "Roll each of nodes 1–5 on the node table; the target is an operations hub. Column 1 is threat tier 1, column 2 tier 2, the target tier 3."
    - "Nodes 1–3 are revealed. Nodes 4, 5 and the target are hidden: mark them '?' and keep their rolls face down (or roll when revealed). A node is revealed when a node linked to it is taken, or for 1 Intel."
  taking:
    - "A node is taken when its mission is graded Decisive or Marginal. Collect the node's reward."
    - "A Failure leaves the node standing; its threat tier rises by 1 (to 4 at most). It may be struck again."
    - "A node can be struck if it is revealed and linked to the base or to a taken node."
  end:
    - "The arc is won when the target is taken: Decisive if its mission was Decisive, otherwise Marginal. Gain 2 Evidence and 1 Standing."
    - "The arc is lost if the turn marker passes the last turn: the network relocates. Lose 1 Standing. Evidence stays."
    - "Between arcs: soldiers keep XP, advances, injuries and recovery; resources carry over; generate a new map. A campaign is usually one to three arcs."

# Node table (d6) for nodes 1-5; target and holding site are placed by the rules.
# mission: chapter 13 mission type; setting ship (vessel) or land (environment).
nodes:
  - { roll: "1", id: salvage_yard, name: Salvage yard,    setting: ship, vessel: salvage_tender, mission: seize,    reward: "+2 Requisition." }
  - { roll: "2", id: freight_run,  name: Freight run,     setting: ship, vessel: freighter,      mission: seize,    reward: "+1 Requisition and +1 Intel." }
  - { roll: "3", id: relay,        name: Relay station,   setting: ship, vessel: station_module, mission: sabotage, reward: "Reveal every node on the map; +1 Intel." }
  - { roll: "4", id: safe_house,   name: Safe house,      setting: land, environment: urban,     mission: capture,  reward: "+1 Intel and +1 Evidence." }
  - { roll: "5", id: corvette,     name: Patrol corvette, setting: ship, vessel: corvette,       mission: capture,  reward: "+1 Standing." }
  - { roll: "6", id: depot,        name: Forward depot,   setting: land, environment: industrial, mission: sabotage, reward: "+2 Requisition; the next mission's threat tier is 1 lower (1 at least)." }
special_nodes:
  - { id: hub,     name: Operations hub, setting: "Roll a die: 1–3 ship (station module), 4–6 land (fortified position).", mission: capture, reward: "The arc is won (see the end of the arc)." }
  - { id: holding, name: Holding site,   setting: "As the node where the soldier was captured.", mission: recover, reward: "The soldier comes home: roll for injury, +1." }

# --------------------------------------------------------------- after-action
rewards:
  - { result: "Decisive", text: "+3 Requisition, +1 Standing. The node is taken." }
  - { result: "Marginal", text: "+1 Requisition. The node is taken." }
  - { result: "Failure",  text: "−1 Standing. The node stands, its threat tier 1 higher (4 at most)." }
  - { result: "HVT extracted as a prisoner", text: "+2 Intel and +1 Evidence." }
  - { result: "Each other prisoner extracted", text: "+1 Intel (2 at most per mission)." }
  - { result: "Data seized (seize mission)", text: "+1 Intel; +1 Evidence as well at threat tier 3 or 4." }
  - { result: "Two or more soldiers Dead", text: "−1 Standing." }

casualties:
  - "Dead: the soldier's name goes on the force's roll of honour."
  - "Down at any point in the mission, and alive at the end: roll on the injury table."
  - "Left behind Down: captured. A holding site node joins the map, linked to the node where it happened, at the same threat tier, revealed. Strike it to bring the soldier home."
  - "Left behind standing: the soldier makes their own way back and is out for 1 turn."
  - "Wounded markers alone leave no lasting injury."

# Injury table, 2d6. A total of 2 or less uses the first row, 12 or more the last.
injury_modifiers:
  - { value: -1, text: "The soldier was Bleeding or Critical during the mission" }
  - { value: 1,  text: "A Medic action saved or treated the soldier during the mission (chapter 7)" }
  - { value: 1,  text: "Medical facility level 2 or 3" }
injuries:
  - { roll: "2",     id: dies,      name: Dies of wounds, out: null, text: "The soldier dies. Roll of honour." }
  - { roll: "3",     id: crippled,  name: Crippled,       out: 3,    text: "Permanently −1 to an attribute: roll a die, 1 Move (−1\"), 2 Shoot, 3 Fight, 4 Physique, 5 Nerve, 6 Tech (0 at least). Out 3 turns." }
  - { roll: "4-5",   id: severe,    name: Severe wound,   out: 2,    text: "Out 2 turns." }
  - { roll: "6-8",   id: wounded,   name: Wounded,        out: 1,    text: "Out 1 turn." }
  - { roll: "9-10",  id: patched,   name: Patched up,     out: 0,    text: "Fit for the next mission." }
  - { roll: "11-12", id: close_call, name: Close call,    out: 0,    text: "Fit for the next mission, and +1 XP." }

# XP per mission, for each soldier who deployed.
xp:
  - { amount: 1, text: "Deployed on the mission" }
  - { amount: 1, text: "Did the objective's action: took it, freed the hostage, set a charge that destroyed a target, or took the HVT" }
  - { amount: 1, text: "Put one or more enemy models Down or worse, or made one surrender" }
  - { amount: 1, text: "The mission was graded Decisive" }
  - { amount: 1, text: "The citation: one soldier per mission, your pick, for the deed of the mission (record it)" }

advances:
  every: 5
  text:
    - "Each time a soldier reaches 5, 10, 15 (and so on) XP, roll a die on the advance table. If the result is already at its cap, choose another row."
    - "Rank follows advances: a Regular becomes a Veteran at 3 advances and an Elite at 6 (a Green soldier becomes Regular at 1). Rank is a label (chapter 1)."
  table:
    - { roll: "1", text: "+1 Shoot (4 at most; 4 is legendary)" }
    - { roll: "2", text: "+1 Fight (4 at most)" }
    - { roll: "3", text: "+1 Physique (3 at most)" }
    - { roll: "4", text: "+1 Nerve (4 at most)" }
    - { roll: "5", text: "+1 Tech (3 at most), or +1\" Move (once per soldier)" }
    - { roll: "6", text: "A skill: Leader, Medic, Marksman (next level), Scout or Low-light; or choose any row above" }
  skills: [leader, medic, marksman, scout, low_light]

honours:
  - { name: Medal, text: "A soldier with three citations is decorated: +1 Standing (once per soldier), and the name goes on the honour roll." }
  - { name: Unit honour, text: "A team earns a mark when all its fit soldiers deploy and the mission is Decisive. At 3 marks it takes one honour from the list below, for good." }
honour_list:
  - { id: breachers, name: Breachers, text: "+1 to the team's tests to set charges and open or force doors." }
  - { id: ghosts,    name: Ghosts,    text: "The first Loud noise the team makes in a mission does not raise the alert track." }
  - { id: steady,    name: Steady,    text: "+1 to the team's breaking tests." }
  - { id: hunters,   name: Hunters,   text: "+1 to hit Unaware models." }

# --------------------------------------------------------------- the base (decision 7.14)
# Each campaign gives the force one home base, a land outpost or a ship. The base is on the map and can be attacked.
bases:
  kinds:
    - { id: outpost, name: Outpost, text: "A base on the ground. It stays where it is on the map. It is defended on a land table of the campaign's environment." }
    - { id: ship, name: Ship, text: "A ship that carries the force. It is the map's starting point wherever the arc is; it is defended aboard its own deck, against boarders." }
  rules:
    - "The base is a place on the map: the arc map's starting point. Nodes linked to it can be struck."
    - "It has six facilities of three levels each. A level costs 4, 6 or 8 Requisition, is bought in Preparation and works from the next turn. Levels are bought in order; each includes the ones below it."
    - "Upkeep: at Upkeep, pay 1 Requisition for every 3 facility levels the base has (rounded down). If you can't, choose one facility: it doesn't work until the upkeep is paid."
    - "An outpost's facilities and a ship's are the same; on a ship, Defences are its internal security."
  facilities:
    - id: medical
      name: Medical
      levels:
        - { cost: 4, text: "Out-of-action times are 1 turn shorter (0 at least)." }
        - { cost: 6, text: "+1 to injury rolls." }
        - { cost: 8, text: "Once per turn, re-roll one injury roll." }
    - id: armoury
      name: Armoury
      levels:
        - { cost: 4, text: "Each mission, one soldier may carry one extra gear item from the gear list." }
        - { cost: 6, text: "Each mission, one soldier may swap its weapon for an LMG, DMR or AT launcher." }
        - { cost: 8, text: "Both of the above for two soldiers each mission." }
    - id: intelligence
      name: Intelligence and comms
      levels:
        - { cost: 4, text: "+1 Intel after each mission graded Decisive or Marginal." }
        - { cost: 6, text: "One Intel use each mission is free." }
        - { cost: 8, text: "At the start of each turn, reveal one hidden node." }
    - id: workshop
      name: Workshop
      levels:
        - { cost: 4, text: "Facility levels cost 1 Requisition less (3, 5 and 7)." }
        - { cost: 6, text: "Salvage: an Automated soldier (a robot or drone) destroyed in a mission rolls on the injury table as if it had gone Down; Dies of wounds means it is scrapped." }
        - { cost: 8, text: "After a defence or recapture mission, rebuild one lost facility level free." }
    - id: barracks
      name: Barracks
      levels:
        - { cost: 4, text: "The roster holds up to 14 soldiers." }
        - { cost: 6, text: "Replacements join with 2 XP." }
        - { cost: 8, text: "The roster holds up to 16 soldiers, and fast-track recovery costs 1 Requisition." }
    - id: defences
      name: Defences
      levels:
        - { cost: 4, text: "Defence missions: before the enemy arrives, set up two pieces of low wall or sandbags (aboard ship: barricades in passages), each within 6\" of an objective." }
        - { cost: 6, text: "Defence missions: an Automated turret (Freespace turret profile) on Overwatch guards each objective; it is a player model." }
        - { cost: 8, text: "Early warning: the base is attacked at threat 5 or more instead of 4, and the first attackers arrive at the end of round 2 instead of round 1." }
  threat:
    max: 6
    attack_at: 4
    raises:
      - { source: "A mission ends with the alert track at 4 or more", amount: 1 }
      - { source: "A mission graded Failure", amount: 1 }
      - { source: "Each soldier captured", amount: 1 }
      - { source: "The Leak event (2)", amount: 1 }
    lowers:
      - { source: "A mission graded Decisive with the alert track at 1 or less", amount: 1 }
      - { source: "Misdirection: spend 2 Intel in Preparation (once a turn)", amount: 1 }
  attacks:
    - "Threat: at Upkeep, if the threat track is at 4 or more (5 with Defences 3), the enemy attacks the base."
    - "Events: some events raise the threat track; a campaign may add events that attack the base outright."
    - "Campaign: a bespoke campaign may name points where the base is attacked, whatever the threat track says."
    - "An attack makes the next campaign turn's mission the base's defence: there is no tasking choice. Its threat tier is the highest tier among nodes linked to the base (1 at least), 1 higher if the threat track is 6 (4 at most)."
    - "After the defence, set the threat track by the result (below)."
  defence:
    board:
      - "Outpost: a small land table of the campaign's environment (chapter 12), rolled as usual, except sectors A1, B1 and C1: the outpost. Put a small building (the command post) in the middle of B1, and a second piece of the player's choice (a hangar, a mast, a store) in A1 or C1. Each is an objective."
      - "Ship: a deck of the ship's vessel (chapter 11). The enemy boards at the airlock. The objectives are the heart and the compartment farthest from it by route."
    deploy:
      - "The player deploys first: every model within 6\" of an objective (aboard ship: in an objective's compartment or a tile next to it), with any Defences."
      - "Doors aboard ship start as the deck rolls them; the player may close any door next to a model."
    enemy:
      - "The attack: roll twice on the threat tier's contact table (chapter 13; reroll false alarm and booby trap). Both elements arrive at the end of round 1 at the enemy entry (land: the middle of the far edge; ship: the airlock), Alerted, with the marker on the nearest objective."
      - "Waves: at each check-in on the clock, roll once more; that element arrives the same way."
      - "Attackers whose profile is Sentry, Cowed or Saboteur use the Aggressive profile instead. The enemy's objective (for tie-breakers and the marker) is the nearest objective still held."
      - "There is no alert track: the alarm has already sounded. The clock is a small mission's: 20 minutes on a d4 (chapter 13)."
    losing: "An objective is lost at the end of a round in which an enemy model is in base contact with it (aboard ship: in its compartment) and no standing player model is within 3\" of it (aboard ship: in that compartment). A player model retakes a lost objective the same way: in base contact at the end of a round, with no standing enemy model within 3\" (aboard ship: in that compartment)."
    grades:
      decisive: "Both objectives held when time runs out or the attack is broken, and no player model Dead."
      marginal: "At least one objective held."
      failure: "Both objectives lost, or the force breaks."
  outcomes:
    - { result: Decisive, text: "The attack is beaten. Threat track to 0; +1 Standing." }
    - { result: Marginal, text: "The base holds, damaged: it loses one facility level (its highest; ties, your choice). Threat track to 1." }
    - { result: Failure, text: "The base is overrun: -1 Standing. No facility works and no Requisition can be spent on the base until it is retaken. The next campaign turn's mission is its recapture." }
  recapture:
    - "The recapture is a seize mission (chapter 13) at the attack's threat tier, on the base's own board: the objective is the command post (outpost) or the heart (ship), the guard is rolled on the tier's table as usual, and the alert track starts at 1."
    - "Decisive: the base is retaken intact. Threat track to 1."
    - "Marginal: retaken, but it loses one more facility level. Threat track to 1."
    - "Failure: the base is lost: -1 Standing. Command assigns a new base of the same kind with every facility at level 0 (an outpost on any taken node, or the map's starting point; a replacement ship). Threat track to 0."

# Requisition costs: a soldier's Requisition is its TV / 10, rounded up (chapter 15).
costs:
  - { item: "Replacement soldier (0 XP): by fireteam, a troop that fills an empty slot in its fireteam; by soldier, any troop the force fields", cost: "Its Requisition (chapter 15)" }
  - { item: "New fireteam (a standard fireteam, or one built to its type, chapter 9), at least half its slots and its Leader", cost: "Its soldiers' Requisition" }
  - { item: "Fast-track recovery: one recovering soldier is fit a turn sooner", cost: 2 }
  - { item: "Base facility level", cost: "4 / 6 / 8 by level (1 less each with a Workshop)" }

# --------------------------------------------------------------- events (2d6)
events:
  - { roll: "2",  name: Leak,               text: "The enemy knows you are coming: the target's threat tier is 1 higher (4 at most), and the threat track rises 1." }
  - { roll: "3",  name: Supply shortfall,   text: "Lose 2 Requisition (0 at least)." }
  - { roll: "4",  name: Enemy reinforces,   text: "The next mission's threat tier is 1 higher (4 at most)." }
  - { roll: "5",  name: Questions from command, text: "Lose 1 Standing, unless you spend 2 Requisition." }
  - { roll: "6",  name: Downtime,           text: "One recovering soldier is fit a turn sooner." }
  - { roll: "7",  name: Quiet,              text: "Nothing happens." }
  - { roll: "8",  name: Informant,          text: "+1 Intel." }
  - { roll: "9",  name: Supply drop,        text: "+2 Requisition." }
  - { roll: "10", name: Volunteers,         text: "One free Regular replacement for an empty slot in one of the force's fireteams (any troop the force fields, if picking by soldier), if the roster has room." }
  - { roll: "11", name: Opportunity,        text: "A new node joins the map: roll its type; threat tier 1; linked to the base or to any taken node; revealed." }
  - { roll: "12", name: Commendation,       text: "+1 Standing." }

# --------------------------------------------------------------- evidence (decision 9.7)
evidence:
  - "Evidence comes from the after-action rewards, safe houses and winning an arc. It is never spent."
  - "At 6 Evidence, the Directorate is exposed: the next arc is against the Meridian Directorate. Its column 1 is threat tier 2, column 2 tier 3, and the target tier 4."

# Short arcs (RJ, 2026-10-22): three authored missions, for a story told in an evening or two.
# The arc sheet names the missions and what each grade leads to. Everything not listed here is unused
# (no Requisition, Intel, Standing, base, events or arc map).
short_arc:
  missions: 3
  text:
    - "A short arc is three authored missions: an opening, a second mission chosen by the opening's grade, and a finale. The arc sheet lists them and what each grade leads to."
    - "Roster: any troops of the faction you own. Name every soldier the first time they deploy; they carry their XP, advances and injuries through the arc."
    - "Force: each mission sets a Troop Value limit (chapter 15) and a model limit. Before it, choose who deploys from the soldiers fit for duty, by fireteam or by soldier as the arc's force-selection setting says (the arc sheet names a default; choose at the start). Count each soldier at its profile's TV; advances are free."
    - "After each mission: casualties and injuries, XP and advances as in a full campaign (chapter 14). An injury that puts a soldier out for turns puts them out for that many missions. A soldier left behind Down is captured and out for the rest of the arc, unless the arc gives a chance to bring them back."
    - "Replacements: a Dead, captured or injured soldier who is not a character may be replaced by a new soldier of the same profile with no XP. A character who dies is gone for the arc."
    - "Grades lead on: the arc sheet says which mission comes next and any edge or setback it carries (a bigger or smaller force, the alert track's start, contacts removed or added)."
    - "The arc's result is the finale's grade, one step better if the first two missions were both Decisive, one step worse if either was a Failure (Decisive, Marginal, Failure; never past either end)."


# --------------------------------------------------------------- campaign definitions (decision 7.15)
# Command latitude: who chooses the next tasking. A campaign definition names one (docs/design/campaign-format.md).
latitudes:
  - { id: black_ops, name: Black Ops, text: "Chapter 14: the force chooses its taskings at Standing 3 or more; at 2 or less command chooses (the highest-tier available node)." }
  - { id: orders,    name: Orders,    text: "Command chooses every tasking: the campaign names the next node, or the highest-tier available node." }
  - { id: free_hand, name: Free hand, text: "The force always chooses its taskings, whatever its Standing." }

# Report templates: short military reports for procedural campaigns (RJ, 2026-10-27). {slots} are filled from the
# campaign state; a bespoke campaign may write its own text instead.
reports:
  - { id: tasking,   name: Tasking,   text: "TASKING. {force} to {mission_name} at {node}. Threat tier {tier}. Expected opposition: {opposition}. Out by {exit}." }
  - { id: briefing,  name: Briefing,  text: "BRIEFING. {node}: {situation} Objective: {objective}. Clock: {limit} minutes. Command intent: {intent}" }
  - { id: sitrep_decisive, name: Sitrep (Decisive), text: "SITREP. {node} taken. Objective complete. Friendly losses: {losses}. Enemy losses: {enemy_losses}. Standing {standing}." }
  - { id: sitrep_marginal, name: Sitrep (Marginal), text: "SITREP. {node} taken at cost. Objective partly complete. Friendly losses: {losses}. Command notes the price." }
  - { id: sitrep_failure,  name: Sitrep (Failure),  text: "SITREP. {node} not taken. Force withdrawn. Friendly losses: {losses}. Enemy alert raised; expect a stronger defence." }
  - { id: aar,       name: After-action summary, text: "AFTER-ACTION. {mission_name}, {grade}. Casualties: {casualties}. Citation: {citation}. Requisition {requisition}, Intel {intel}, Threat {threat}." }
  - { id: threat,    name: Threat warning, text: "WARNING. Signals traffic around {base} is rising (threat {threat}). Expect enemy action against the base." }
  - { id: base_attack, name: Base attack, text: "FLASH. {base} under attack. Enemy force estimated tier {tier}. All personnel to defensive positions." }
