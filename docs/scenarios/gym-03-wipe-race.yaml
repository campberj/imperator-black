setup:
- 'Tiles: three 6"×6", four 6"×3" (one stood on end as P4) and three 3"×3" (two junctions and the escape pod). Lay them as the map shows;
  the rest of the board is outside the hull.'
- 'Doors as marked: D1 locked (Hardened), D4 closed, D2, D3, D5 and D6 open.'
- Cover as marked; the Terrain table suggests pieces.
- Enemy models 1–6 on their marked positions. Models 7 and 8 start off the board.
- Task Force Boone deploys wholly inside the docking passage (P1).
special_rules:
- title: Surprise
  text: Task Force Boone wins initiative in round 1 automatically.
- title: The enemy
  text: Run the enemy with chapter 10 and the behavior cards. Models 1–6 start Unaware. The enemy's objective, for tie-breakers, is
    the data core. The recovery captain (6) never leaves the operations centre.
- title: The wipe
  text: The salvage techs (1, 2) are Saboteurs and their task is the data core. While Unaware they do nothing. Once Alerted, each Interact
    by a tech within 1" of the core adds 1 to the wipe track. At 6 the data is gone. Track it with yellow cubes beside the core.
- title: Pull the data
  text: 'A Task Force Boone model within 1" of the core may Interact to copy the data: automatic for the Data Specialist, 2d6 + Tech,
    9+ for anyone else. It takes two successful Interacts, by any models, in any rounds. The data is secured once the second succeeds,
    if the wipe track is still below 6.'
- title: Contract reaction team
  text: At the end of the round after the alarm is raised, place the Borz Cyka team (7, 8) at the east end of passage P3, Alerted. If
    P3's east end is blocked, place them as close to it as they can stand.
- title: Escape pod
  text: 'S1 is an escape pod (chapter 11): an enemy model that ends its activation in it leaves the board, as if fled.'
- title: Prisoner
  text: If the recovery captain is captured (chapter 7) or surrenders, Task Force Boone takes it.
victory:
  length: 8 rounds.
  goal: Secure the data before the wipe reaches 6.
  outcomes:
  - grade: Decisive
    text: 'Data secured and no Task Force Boone model Dead. Bonus: recovery captain captured.'
  - grade: Marginal
    text: Data secured, with one or more Task Force Boone models Dead.
  - grade: Failure
    text: The wipe reaches 6, the data is not secured by the end of round 8, or the boarding element breaks.
watch_for:
- Was the generated station deck (chapter 11) a good fight? Anything you would change about how it was built?
- Did the Saboteur card make the wipe a real race once the alarm went up?
- 'Hardened lock on D1: worth hacking, breaching, or ignoring?'
- 'Shield, Layered armour and the HMG: did the Borz feel tougher than Freespace security without being a wall?'
- 'Task Force Boone at Shoot 2: still too many misses, or about right?'
- Count judgment calls per round for the enemy.
