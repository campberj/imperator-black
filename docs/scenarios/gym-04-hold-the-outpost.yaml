# Gym scenario 4: Hold the Outpost. The first base defence test (rules v0.5, chapter 14, The base).
# Same table as Gym 2: RJ's 35" × 43" desert board, played lengthwise, with the mesa as the outpost.
# Printed by: python3 tools/print_scenario.py docs/scenarios/gym-04-hold-the-outpost.yaml
# Coordinates are inches from the bottom-left corner. The outpost (mesa) is at the top; the enemy enters at the bottom.
# A defence normally puts the outpost on the player's edge of a rolled table (chapter 14); this gym reuses the
# Gym 2 table instead, so the mesa end is the outpost and the far edge is the bottom.
id: gym-04-hold-the-outpost
title: "Gym 4: Hold the Outpost"
kind_label: "base defence gym scenario"
terrain_table: false
rules_version: "0.5"

situation: >
  The Republic has turned the mesa into a forward outpost. The old relay now reports for the clone
  battalion, and the dug-out at the mesa's foot holds its stores. The threat track has reached 4: a
  Separatist droid column is coming up through the spire flats. Commander Tano's squad, two sandbag
  positions and a pair of automated turrets must hold until the gunships arrive.

board: { width: 35, height: 43 }
tiles: []
doors: []
map_note: >
  Each grid square is 6". Board 35" × 43", played lengthwise: the outpost is the mesa at the top;
  the droids enter at EE, the gap between the spire field (T10) and the spire mound (T15) at the
  middle of the bottom edge. Shaded boxes mark the deployment areas: deploy within 6" of either
  objective. Enemy positions are where the first wave arrives.

walls_and_doors: >
  No walls or doors. The mesa and the central ridge are raised ground, one level (3") high; the rock
  shelf at the mesa's east end is two levels. Climbing any sheer face costs 2" per level (chapter 12).

# Terrain, as Gym 2. type: hill (raised ground), area (area terrain), ditch, light, heavy (solid).
cover:
  - { id: T1,  x: 11.5, y: 30.5, w: 20,  h: 12.5, type: hill,  label: "Mesa",            piece: "The dark mesa with the relay. One level up; sheer sides, except the gentle west slope beside the spire field." }
  - { id: T2,  x: 26,   y: 34,   w: 7.5, h: 9,    type: heavy, label: "Rock shelf",      piece: "The high rock shelf at the mesa's east end: two levels, sheer. Blocks sight across the mesa top." }
  - { id: T3,  x: 19.5, y: 33.5, w: 2,   h: 2.5,  type: heavy, label: "Command post",    piece: "The relay tower, now the command post. Solid: Heavy cover, blocks sight. Objective 1." }
  - { id: T4,  x: 15,   y: 38.5, w: 3.5, h: 4.5,  type: area,  label: "Camo netting",    piece: "Camouflage netting over a tent: scrub (Light cover inside; sight through no more than 3\")." }
  - { id: T5,  x: 22.5, y: 26.5, w: 5,   h: 4,    type: area,  label: "Dug-out",         piece: "Netting over the dug-out door at the mesa's foot: scrub. The stores; objective 2 is the door." }
  - { id: T6,  x: 16.3, y: 17.8, w: 8.4, h: 12.5, type: hill,  label: "Central ridge",   piece: "The long tan ridge: one level, sheer sides. Light cover behind its crest against shooters below." }
  - { id: T7,  x: 12,   y: 25.8, w: 4.5, h: 4.5,  type: heavy, label: "Great spire",     piece: "The tall spire at the mesa's foot: solid, blocks sight." }
  - { id: T8,  x: 13,   y: 9.5,  w: 10,  h: 8.5,  type: heavy, label: "Dark boulder",    piece: "The large dark rock: solid, blocks sight; too steep to climb." }
  - { id: T9,  x: 4.2,  y: 32.3, w: 7.2, h: 9.4,  type: area,  label: "Spire field",     piece: "The round base with small spires: dense woods (Light cover inside, sight no more than 1\" through, difficult ground)." }
  - { id: T10, x: 8.4,  y: 0.5,  w: 6.6, h: 8.2,  type: area,  label: "Spire field",     piece: "The second round spire base: dense woods, as T9." }
  - { id: T11, x: 4.4,  y: 27.5, w: 3,   h: 3.7,  type: heavy, label: "Spire",           piece: "Small stacked spire: solid." }
  - { id: T12, x: 7.5,  y: 23.6, w: 3.5, h: 6.5,  type: light, label: "Rock spine",      piece: "The low curved rock line west of the ridge: low wall (Heavy cover within 1\" behind it; obstacle)." }
  - { id: T13, x: 8.9,  y: 17.2, w: 3.9, h: 5.6,  type: heavy, label: "Rock stack",      piece: "The stacked rock outcrop west of centre: solid." }
  - { id: T14, x: 4,    y: 8.6,  w: 3.7, h: 6.4,  type: light, label: "Rock spine",      piece: "The curved rock line on the west side: low wall." }
  - { id: T15, x: 17,   y: 1,    w: 6.8, h: 8,    type: heavy, label: "Spire mound",     piece: "The big spire on its mound south of the boulder: solid." }
  - { id: T16, x: 24.5, y: 2.2,  w: 3.5, h: 4.3,  type: heavy, label: "Spire",           piece: "Small spire: solid." }
  - { id: T17, x: 25.2, y: 14,   w: 3.7, h: 5.1,  type: light, label: "Rock spine",      piece: "The upright rock line east of the boulder: low wall." }
  - { id: T18, x: 27.3, y: 9.9,  w: 6.3, h: 3.9,  type: heavy, label: "Spire ridge",     piece: "The long leaning spire on the east side: solid." }
  - { id: T19, x: 31.3, y: 19.1, w: 3.2, h: 2.2,  type: heavy, label: "Spire",           piece: "Small spire on the east edge: solid." }
  - { id: T20, x: 27.5, y: 22.1, w: 3.3, h: 2,    type: heavy, label: "Spire",           piece: "Small spire below the mesa: solid." }
  - { id: T21, x: 24,   y: 23.6, w: 2.4, h: 3.5,  type: light, label: "Rock spine",      piece: "Short rock line by the dug-out: low wall." }
  - { id: T22, x: 27.5, y: 15.5, w: 6,   h: 4.5,  type: ditch, label: "Crevice",         piece: "The brown crevice printed on the mat (east): a ditch (Heavy cover inside against shooters outside; getting in or out is an obstacle)." }
  - { id: T23, x: 4,    y: 5.5,  w: 6,   h: 3,    type: ditch, label: "Crevice",         piece: "The brown crevice printed on the mat (west): a ditch." }

deploy:
  - { x: 14.5, y: 26.6, w: 12, h: 12, side: player, label: "within 6\" of 1" }
  - { x: 19,   y: 23.5, w: 12, h: 12, side: player, label: "within 6\" of 2" }

objectives:
  - { n: 1, x: 20.5, y: 32.6, label: "Command post (the old relay, on the mesa)" }
  - { n: 2, x: 25,   y: 29.6, label: "Stores (the dug-out door, at the mesa's foot)" }

enemy_entry: { x: 16, y: 0.7 }

# The defence rules: attackers whose profile is Sentry, Cowed or Saboteur use Aggressive.
behavior_overrides: { sep_droidekas: aggressive }

# Cards for the elements a wave can add (Separatist tier 2 contact table).
extra_cards:
  troops: [sep_b2, sep_b2_heavy, sep_tactical]
  behaviors: [tactical]

# The first wave is fixed for the gym (a campaign defence rolls it). Positions are where it arrives.
enemies:
  - { n: 1, troop: sep_b1,       element: sep_b1_section, x: 15.5, y: 2.2, state: "Arrives at EE at the end of round 1, Alerted" }
  - { n: 2, troop: sep_b1,       element: sep_b1_section, x: 16.5, y: 2.2, state: "Arrives with model 1" }
  - { n: 3, troop: sep_b1,       element: sep_b1_section, x: 15.5, y: 3.4, state: "Arrives with model 1" }
  - { n: 4, troop: sep_b1_heavy, element: sep_b1_section, x: 16.5, y: 3.4, state: "Arrives with model 1" }
  - { n: 5, troop: sep_droideka, element: sep_droidekas,  x: 15.5, y: 4.8, state: "Arrives with model 1; Aggressive" }
  - { n: 6, troop: sep_droideka, element: sep_droidekas,  x: 16.5, y: 4.8, state: "Arrives with model 1; Aggressive" }

player:
  - { troop: rep_ahsoka,         label: "Commander" }
  - { troop: rep_clone_sergeant, label: "Sergeant" }
  - { troop: rep_clone_trooper,  label: "Trooper" }
  - { troop: rep_clone_trooper,  label: "Trooper" }
  - { troop: rep_clone_trooper,  label: "Trooper" }
  - { troop: rep_clone_heavy,    label: "Heavy (Z-6)" }
  - { troop: fs_turret,          label: "Turret, objective 1" }
  - { troop: fs_turret,          label: "Turret, objective 2" }

setup:
  - "Use the Gym 2 table; the map and the terrain list say what each piece counts as (chapter 12)."
  - "Roll for conditions (chapter 12)."
  - "Defences 1: set up two pieces of low wall or sandbags, each within 6\" of an objective."
  - "Defences 2: place a turret within 2\" of each objective, on Overwatch."
  - "The Republic deploys every model within 6\" of an objective. The droids start off the table."
  - "The clock starts at 0. There is no alert track and no Unaware enemy: the alarm has sounded."

special_rules:
  - title: "Objectives"
    text: >
      An objective is lost at the end of a round in which an enemy model is in base contact with it and
      no standing Republic model is within 3" of it. A Republic model retakes a lost objective the same
      way: in base contact at the end of a round, with no standing enemy model within 3".
  - title: "The first wave"
    text: >
      At the end of round 1, place models 1–6 at EE as marked, Alerted, with the marker on the nearest
      objective still held (the stores, to begin with). They activate from round 2. The droidekas use
      the Aggressive card instead of Sentry, as every Sentry, Cowed or Saboteur attacker does in a defence.
  - title: "Waves"
    text: >
      The clock is a small mission's: at the end of each round, roll a d4 and add that many minutes.
      When the clock reaches or passes a check-in (10 and 15 minutes), roll a d6 on the Separatist tier 2
      contact table, rerolling a 1: 2–3 B1 section, 4 B2 squad, 5 droideka pair (Aggressive), 6 tactical
      droid and escort. That element arrives at EE at the end of that round, Alerted, the marker on the
      nearest objective still held. Number its models on from the last.
  - title: "The enemy"
    text: >
      Run the droids with chapter 10 and the behavior cards. Their objective, for tie-breakers, is the
      nearest objective still held. There is no alert track to raise.
  - title: "Turrets"
    text: >
      Each turret is a Republic model (Sentry Turret profile, Automated) that cannot move. It may stay on
      Overwatch every round. Count turrets when checking whether a standing Republic model is within 3"
      of an objective.
  - title: "Getting onto the mesa"
    text: >
      The mesa is one level up. Climbing a sheer face costs 2" (chapter 12); the west slope beside the
      spire field (T9) is open ground. Ahsoka's Leap ignores the climb. A droideka cannot roll up or
      down a level (Rolling): it walks instead.

victory:
  length: "Until the clock reaches 20 minutes, or the attack breaks."
  goal: "Hold both objectives."
  outcomes:
    - { grade: "Decisive", text: "Both objectives held when time runs out or the attack breaks, and no Republic model Dead." }
    - { grade: "Marginal", text: "At least one objective held." }
    - { grade: "Failure",  text: "Both objectives lost, or the Republic force breaks." }

watch_for:
  - "Clock: how many rounds did 20 minutes on a d4 give, and did the waves at 10 and 15 arrive at a sensible time?"
  - "Was the first wave plus two waves the right pressure for a defended squad? Note the score at each check-in."
  - "Objectives: did the 3\" rule for losing and retaking an objective need a judgment call?"
  - "Sandbags and turrets: were they worth 4 and 6 Requisition? Did the turrets matter, or die at once?"
  - "Aggressive droidekas: did they push the objectives in a believable way, or just roll into the guns?"
  - "Should turrets count as standing models for holding an objective? Log any round it decided the result."
  - "Second game: play with Defences 3 (early warning): the first wave arrives at the end of round 2. Did it change the grade?"
