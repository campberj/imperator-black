# Gym scenario 1: First Breach.
# A small, fixed boarding action for the Phase 2 exit playtest (rules v0.4).
# Printed by: python3 tools/print_scenario.py docs/scenarios/gym-01-first-breach.yaml
# Coordinates are inches from the bottom-left corner of the board; the grid is 3".
id: gym-01-first-breach
title: "Gym 1: First Breach"
rules_version: "0.4"

situation: >
  Freespace Solutions has seized the ore hauler MV Halden's Promise under a disputed debt claim
  and is holding it at a remote mooring. Command wants its navigation data core before Freespace
  wipes it: the logs should show where the ship was taken and who paid for it. A Task Force Boone
  boarding element has docked at the forward airlock. The crew has been taken off; a small
  security detail remains aboard.

board: { width: 18, height: 12 }

tiles:
  - { id: P1, name: "Docking passage", size: "6x3", x: 0,  y: 3, w: 6, h: 3 }
  - { id: H1, name: "Cargo hold",      size: "6x6", x: 6,  y: 0, w: 6, h: 6 }
  - { id: J,  name: "Junction",        size: "3x3", x: 12, y: 3, w: 3, h: 3 }
  - { id: P3, name: "Service passage", size: "6x3", x: 9,  y: 6, w: 3, h: 6 }
  - { id: H2, name: "Control room",    size: "6x6", x: 12, y: 6, w: 6, h: 6 }

# Doors sit on a wall. orientation: v = on a vertical wall (west/east), h = on a horizontal wall.
doors:
  - { id: D1, x: 6,    y: 4.5,  orientation: v, state: closed, note: "Docking passage to cargo hold" }
  - { id: D2, x: 12,   y: 4.5,  orientation: v, state: open,   note: "Cargo hold to junction" }
  - { id: D3, x: 13.5, y: 6,    orientation: h, state: locked, note: "Junction to control room" }
  - { id: D4, x: 10.5, y: 6,    orientation: h, state: closed, note: "Cargo hold to service passage" }
  - { id: D5, x: 12,   y: 10.5, orientation: v, state: closed, note: "Service passage to control room" }

# Airlock hatch on the west end of P1: the boarding element's way in and out.
entry: { x: 0, y: 4.5, orientation: v, label: "Airlock (entry and exit)" }

# Cover pieces: crates, consoles and machinery (any suitable scenery).
cover:
  - { x: 8,    y: 1.5, w: 1.5, h: 1,   type: light, label: "Crates" }
  - { x: 9.3,  y: 3.6, w: 1,   h: 1,   type: light, label: "Crates" }
  - { x: 10.6, y: 0.6, w: 1,   h: 1.6, type: heavy, label: "Loader" }
  - { x: 14.6, y: 9.4, w: 0.8, h: 0.8, type: heavy, label: "Column" }
  - { x: 15.6, y: 11,  w: 2,   h: 0.7, type: light, label: "Console bank" }

deploy:
  - { x: 0.3, y: 3.3, w: 5.4, h: 2.4, side: player, label: "Boarding element" }

objective: { x: 16.6, y: 10.6, label: "Data core" }

# Enemy models are numbered on the map and on their cards.
enemies:
  - { n: 1, troop: fs_security,         weapon: carbine, x: 8.8,  y: 2.9,  state: "Unaware" }
  - { n: 2, troop: fs_security,         weapon: shotgun, x: 10.4, y: 4.9,  state: "Unaware" }
  - { n: 3, troop: fs_security_gunner,                   x: 16.2, y: 7.6,  state: "Overwatch, facing D3 and D5" }
  - { n: 4, troop: fs_recovery_captain,                  x: 17,   y: 9.6,  state: "Unaware, guarding the data core" }

# Player models: troop id, chosen weapon and gear, and a label for the card.
player:
  - { troop: tfb_vat_leader,      label: "Team Leader" }
  - { troop: tfb_vat_assaulter,   label: "Breacher",  weapon: shotgun, gear: [breaching_charge] }
  - { troop: tfb_vat_assaulter,   label: "Assaulter", gear: [breaching_tool] }
  - { troop: tfb_vat_gunner,      label: "Gunner" }
  - { troop: tfb_data_specialist, label: "Specialist" }
  - { troop: tfb_pathfinder,      label: "Medic (attached)", gear: [trauma_kit] }

setup:
  - "Tiles: two 6\"×6\", two 6\"×3\" (one stood on end as the service passage) and one 3\"×3\". The rest of the board is open space outside the hull."
  - "Five doors as marked: D1, D4 and D5 closed; D2 open; D3 locked."
  - "Cover as marked. Light: crates and the console bank. Heavy: the cargo loader and the column."
  - "Enemy models 1–4 on their marked positions. Model 3 starts with an Overwatch marker."
  - "Task Force Boone deploys wholly inside the docking passage."

special_rules:
  - title: "Surprise"
    text: "Task Force Boone wins initiative in round 1 automatically."
  - title: "Unaware"
    text: >
      Unaware enemy models do not activate and cannot react. The whole enemy becomes aware at once
      when a Task Force Boone model makes noise (fires a weapon without the Silenced keyword,
      throws a frag or flashbang, uses a breaching tool or detonates a charge), or ends a Move in an
      enemy model's line of sight. Model 3 is not unaware: it is on Overwatch from the start.
  - title: "Locked door D3"
    text: "Open it with a breaching charge, a breaching tool (2d6 + Physique, 8+) or the Data Specialist's hacking rig (2d6 + Tech, 9+, quiet). Or go around through the service passage."
  - title: "Data core"
    text: >
      A Task Force Boone model in base contact with the data core may Interact to pull it:
      automatic for the Data Specialist, 2d6 + Tech 8+ for anyone else. That model now carries it
      (if it goes Down, another model in base contact may pick it up with an Interact).
  - title: "Prisoner"
    text: "If the Recovery Captain is overpowered in close combat, Task Force Boone may capture it instead of putting it Down."

victory:
  length: "8 rounds."
  goal: "Carry the data core back into the docking passage (the airlock) by the end of round 8."
  outcomes:
    - { grade: "Decisive",  text: "Data core extracted and no Task Force Boone model Dead. Bonus: Recovery Captain captured." }
    - { grade: "Marginal",  text: "Data core extracted, with one or more Task Force Boone models Dead." }
    - { grade: "Failure",   text: "Data core not extracted by the end of round 8, or the boarding element breaks." }

# Stopgap enemy orders until Phase 3's behavior tables replace them.
enemy_orders:
  activation:
    - "A model with 3+ Suppression (it Rallies)."
    - "A model in the open with a target in sight."
    - "A model in cover with a target in sight."
    - "Any other model, nearest the data core first."
  priorities:
    - { who: "All", what: "If Pinned: Rally, then Find Cover or Move to the nearest cover. If in the open with cover within one Move: Move to it." }
    - { who: "Asset Security Officer", what: "Target within short range: Aim, then Shoot. Otherwise Move to cover closer to the target, then Shoot. No target in sight: go on Overwatch facing the nearest door." }
    - { who: "Asset Security Gunner", what: "Two or more targets in sight: Suppressive Fire at the nearest, then Shoot another. One target: Shoot it twice. None: Overwatch." }
    - { who: "Recovery Captain", what: "Rally the most suppressed friend within 6\", then act as an Officer. Never leaves the control room." }
  rules:
    - "Targets: the nearest visible Task Force Boone model not in cover; if all are in cover, the one in the least cover; ties by dice."
    - "Reactions: a model on Overwatch always Shoots at the first trigger it can. An unactivated model reacts only when shot at in the open, by Moving to cover."
    - "Close combat: an enemy model Breaks only if it lost the last exchange and has a Wounded marker or 3+ Suppression."
    - "Choices the orders don't settle: the option nearest the data core, then the lowest-numbered model."

watch_for:
  - "Do reactions and Overwatch make doorways feel dangerous without feeling unfair?"
  - "Are Wounded markers and Wounds easy to track?"
  - "Does close combat resolve in a few exchanges?"
  - "Is the hack, breach or go-around choice at D3 a real decision?"
  - "Can the cards and quick reference be read at arm's length?"
  - "Where did the enemy orders act stupidly or need a judgment call? (Phase 3 input.)"
