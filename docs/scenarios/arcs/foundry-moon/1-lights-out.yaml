briefing:
- heading: Tasking
  text: Sabotage. Destroy the two uplink masts and get out.
- heading: Situation
  text: Refinery Nine is the outermost station of the droid foundry on Ordo Kessa. Its two uplink masts tie it into the defence
    grid that guards the landing fields. A B1 section stands watch at the west mast; more droids work the yards. Knock both
    masts out before dawn and the gunships can land.
- heading: Objective
  text: 'The uplink masts in sector A3 (west) and sector C3 (east). A model in base contact sets a charge with an Interact
    (models without breaching charges use the mast''s own maintenance panel: same Interact). The mast is destroyed at the
    end of that round (Very loud), unless an enemy model is in base contact with it then, which disarms the charge.'
- heading: Opposition
  text: 'Separatist Alliance, threat tier 1. Guard (known): B1 battle droid section (4 models), at the west mast, Unaware.
    Contacts (unknown): 3 chips.'
