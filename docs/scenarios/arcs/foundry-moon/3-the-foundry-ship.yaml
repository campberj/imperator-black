briefing:
- heading: Tasking
  text: Sabotage. Destroy the bridge and engineering, and get out.
- heading: Situation
  text: 'The foundry''s output is loading aboard the frigate Iron Covenant on the landing field: a battalion of droids, racked
    and powered down. Board the frigate''s command deck, destroy the bridge and engineering so it never lifts, and get out.
    General Grievous is aboard to see the shipment off.'
- heading: Objective
  text: 'The bridge (C1) and engineering (C2). A model in base contact sets a charge with an Interact (models without breaching
    charges use the room''s own systems: same Interact). The target is destroyed at the end of that round (Very loud), unless
    an enemy model is in base contact with it then, which disarms the charge.'
- heading: Opposition
  text: 'Separatist Alliance, threat tier 3. Guard (known): B1 battle droid section (4 models), on the bridge, Unaware. Contacts
    (unknown): 4 chips. Reinforcements: General Grievous and two MagnaGuards.'
- heading: Ground
  text: 'The frigate''s command deck (corvette layout, deck 8). Hazard: every outer wall is hull: a breaching charge or frag
    that damages it causes decompression (chapter 8). The droids are sealed; clones in clone armour are too.'
- heading: Complication
  text: 'Early warning: the alert track starts at 1 (2 if Kraken escaped in 2A, or the pilot was lost in 2B).'
- heading: Extraction and time
  text: 'Out by the airlock (P1). Enemy entry and exit: P3. Second enemy exit: secondary airlock (S2). Small mission: 20 minutes,
    clock die d4. Check-ins every 5 minutes from minute 10.'
- heading: Force
  text: 'Republic: up to 350 TV and 8 models from the soldiers fit for duty (chapter 14, short arcs); 400 or 300 TV after
    2B.'
