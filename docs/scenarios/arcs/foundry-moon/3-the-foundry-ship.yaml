special_rules:
- title: From mission 2
  text: '2A Decisive: remove two contact chips of your choice before play; Marginal: remove one. 2A Failure: alert starts
    1 higher. 2B Decisive: +50 TV and the Republic wins initiative in round 1; Marginal: +50 TV; Failure: -50 TV and alert
    starts 1 higher.'
- title: General Grievous
  text: 'At alert 4, Grievous and two MagnaGuards arrive at the enemy entry (P3), Alerted, Aggressive. Grievous is a Leader:
    his MagnaGuards fight with the Elite drill anyway.'
- title: Grievous withdraws
  text: When Grievous is Wounded, or has 2 or more Suppression, he uses the Handler profile's escape line from then on, toward
    the nearest enemy exit (P3 or S2). If he leaves the board, he escapes to fight another day.
- title: The racked droids
  text: 'The droids in the holds are powered down and play no part, unless the alert track reaches 6: then the lockdown also
    places one B1 battle droid section at the enemy entry, Alerted.'
next:
- grade: Decisive
  to: end
  report: SITREP. Iron Covenant crippled on the pad. Battalion shipment destroyed in its racks.
  text: The frigate never lifts, and the foundry's next battalion with it. Work out the arc's result (chapter 14, short arcs).
- grade: Marginal
  to: end
  report: SITREP. Iron Covenant damaged. Lift delayed by weeks.
  text: 'The frigate is crippled but repairable: the shipment is weeks late. Work out the arc''s result.'
- grade: Failure
  to: end
  report: FLASH. Iron Covenant has lifted. Battalion shipment en route to the front.
  text: The Iron Covenant lifts with its battalion. Work out the arc's result.
