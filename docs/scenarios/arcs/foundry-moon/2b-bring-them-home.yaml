special_rules:
- title: The pilot
  text: 'The hostage is a clone pilot (unit card: Hostage), bound in the netted tent (T4). A dead pilot is a Failure.'
- title: Battle computer
  text: While the tactical droid stands, Separatist elements within 12" of it and in its sight use the Tactical profile with
    the Regular drill.
- title: The wreck
  text: A Republic model that ends a Move in base contact with the gunship wreck may Interact to take a thermal detonator
    from the gunship's stores (once per model).
- title: Getting onto the mesa
  text: The mesa is one level up. Climbing a sheer face costs 2" (chapter 12); the west slope beside the spire field (T9)
    is open ground. A Leap ignores the climb.
briefing:
- heading: Tasking
  text: 'Recover personnel: the gunship''s pilot.'
- heading: Situation
  text: The grid stayed up. It caught the gunship bringing the second wave over the spire flats; the gunship came down hard,
    and droids have dragged its pilot to the relay post on the mesa for a tactical droid to question. The rest of the crew
    are dead or scattered. Get the pilot back before the droids move them to the foundry.
- heading: Objective
  text: 'The pilot, bound in the netted tent on the mesa (T4). The hostage (unit card: Hostage) starts bound. A player model
    in base contact frees them with an Interact. From then on the hostage is a player model: it activates after the model
    that freed it, every round, and must end each activation within 3" of a player model if it can.'
- heading: Opposition
  text: 'Separatist Alliance, threat tier 2. Guard (known): a tactical droid and two B1s, at the tent, Unaware. Contacts (unknown):
    4 chips. Reinforcements: a B2 squad.'
- heading: Ground
  text: 'RJ''s desert table (Gym 2), with the gunship wreck in the west flats. Conditions: roll (chapter 12).'
- heading: Complication
