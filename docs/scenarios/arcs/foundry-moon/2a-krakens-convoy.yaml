map_note: 'Each grid square is 6". RJ''s 35" × 43" desert table, played lengthwise, as in Gym 2: the Republic enters from
  the bottom edge, the mesa is at the top. The mesa and central ridge are one level up (sheer sides; the mesa''s west slope
  beside the spire field is open ground); the rock shelf is two levels. Enemy positions are model centres.'
task: 'Kraken is the HVT. A droid cannot be taken prisoner: put Kraken Down, or destroy it, then a model in base contact pulls
  its memory core with an Interact. The core travels with the model that took it, as data (chapter 13, seize); if that model
  goes Down, a model in base contact may take it with an Interact. Extract it by the Republic''s edge.'
lockdown: 'Kraken runs: from now on it activates first each enemy turn, using the Handler profile''s escape line toward the
  enemy''s exit (the north-west corner). If it leaves the board, it has escaped. It also runs once the alert track reaches
  4 (see Special rules).'
grades:
- grade: Decisive
  text: Kraken's memory core extracted, and no Republic model Dead.
- grade: Marginal
  text: Kraken's memory core extracted, or Kraken destroyed.
- grade: Failure
  text: Kraken escaped, or still active when time runs out.
next:
- grade: Decisive
  text: 'Mission 3, The Foundry Ship. The core holds the frigate''s codes: before setting up, remove two contact chips of
    your choice.'
- grade: Marginal
  text: 'Mission 3, The Foundry Ship. Some codes survived: before setting up, remove one contact chip of your choice.'
- grade: Failure
  text: 'Mission 3, The Foundry Ship. Kraken reaches the frigate and warns it: mission 3''s alert track starts 1 higher.'
special_rules:
- title: From Refinery Nine
  text: If mission 1 was Decisive, the Republic wins initiative in round 1. If it was Marginal, the alert track starts at
    1.
- title: The convoy is leaving
  text: Kraken runs (as the lockdown) from the end of the round in which the alert track reaches 4, as well as at 6.
- title: Battle computer
  text: 'While Kraken stands, every Separatist element within 18" of it uses the Tactical profile with the Veteran drill (Battle
    computer 2): no line of sight needed.'
- title: Getting onto the mesa
  text: The mesa is one level up. Climbing a sheer face costs 2" (chapter 12); the west slope beside the spire field (T9)
    is open ground. A Leap ignores the climb.
briefing:
- heading: Tasking
  text: 'Capture a high-value target: Kraken''s memory core.'
- heading: Situation
  text: 'With the grid down, a gunship spotted Kraken''s convoy halted on the mesa above the spire flats: its AAT has thrown
    a repulsor, and the super tactical droid is at the old relay post, re-routing the moon''s droids by hand. Kraken runs
    the foundry''s defence. Its memory core holds the codes of the ship that carries the foundry''s output.'
- heading: Objective
  text: 'Kraken, at the relay post on the mesa. Kraken is the HVT. A droid cannot be taken prisoner: put Kraken Down, or destroy
    it, then a model in base contact pulls its memory core with an Interact. The core travels with the model that took it,
    as data (chapter 13, seize); if that model goes Down, a model in base contact may take it with an Interact. Extract it
    by the Republic''s edge.'
- heading: Opposition
  text: 'Separatist Alliance, threat tier 2. Guard (known): Kraken and two B2 super battle droids, at the relay post, Unaware.
    Contacts (unknown): 4 chips. Reinforcements: a B2 squad.'
- heading: Ground
  text: 'RJ''s desert table (Gym 2), with the AAT on the mesa. Conditions: roll (chapter 12).'
- heading: Complication
  text: None, but see From Refinery Nine (Special rules).
- heading: Extraction and time
  text: 'Out by the Republic''s own edge. Enemy entry and exit: the north-west corner. Small mission: 20 minutes, clock die
    d4. Check-ins every 5 minutes from minute 10. Alert track starts at 0 (1 after a Marginal mission 1).'
- heading: Force
  text: 'Republic: up to 300 TV and 7 models from the soldiers fit for duty (chapter 14, short arcs).'
